<style>
/* Brand: Elegancia Resources red + black. Layout: an operations console. Sticky header with the operating day, tab rail, then dense tables and cards. One column on phones. */
:root{
  --bg:#f6f6f5; --surface:#ffffff; --sunk:#efefed; --fg:#141414; --muted:#666462; --line:#e3e2df;
  --accent:#e3171d; --accent-ink:#ffffff; --accent-soft:#fde8e8; --ink:#111111; --ink-fg:#ffffff;
  --ok:#1d7447; --ok-soft:#e3f2ea; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b42318; --bad-soft:#fbe6e4; --idle:#5d6470; --idle-soft:#eceef1;
  --demo:#5b3fa8; --demo-soft:#eee9fa;
  --f-display:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --surface:#191919; --sunk:#222222; --fg:#f2f2f0; --muted:#a3a19e; --line:#2f2f2e;
  --accent:#ff4b50; --accent-ink:#ffffff; --accent-soft:#3a1617; --ink:#000000; --ink-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#173226; --warn:#e5ab52; --warn-soft:#382a12; --bad:#f2877c; --bad-soft:#3d1c19; --idle:#a3aab5; --idle-soft:#262a30;
  --demo:#b7a2f2; --demo-soft:#2a2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --surface:#191919; --sunk:#222222; --fg:#f2f2f0; --muted:#a3a19e; --line:#2f2f2e;
  --accent:#ff4b50; --accent-ink:#ffffff; --accent-soft:#3a1617; --ink:#000000; --ink-fg:#ffffff;
  --ok:#62c48f; --ok-soft:#173226; --warn:#e5ab52; --warn-soft:#382a12; --bad:#f2877c; --bad-soft:#3d1c19; --idle:#a3aab5; --idle-soft:#262a30;
  --demo:#b7a2f2; --demo-soft:#2a2240; color-scheme:dark}
*{box-sizing:border-box}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline-block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:inline-block}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto;min-width:0}
.brand img{height:30px;width:auto}
.brand .bt{display:flex;flex-direction:column;line-height:1.1;border-inline-start:2px solid var(--accent);padding-inline-start:12px}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:900;letter-spacing:.02em;color:var(--fg)}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.menu-wrap{position:relative;order:2}.ctrls{order:1}
.burger{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative}
.burger svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:15;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgb(0 0 0 / .18);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;background:none;border:0;border-radius:6px;padding:10px 12px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--sunk)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.menu .danger{color:var(--accent)}
.wa{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#25d366;color:#ffffff;vertical-align:middle;margin-inline-start:6px;flex:none}
.wa svg{width:14px;height:14px}
.kpi{cursor:pointer;text-align:start;border:0;font:inherit;color:inherit;background:var(--surface)}
.kpi:hover{background:var(--sunk)}
.ann{border-inline-start:3px solid var(--accent);padding:10px 12px;background:var(--sunk);border-radius:6px;white-space:pre-wrap}
.reads{display:flex;flex-wrap:wrap;gap:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=time],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;max-width:100%}
textarea{width:100%;min-height:80px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:28px;padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--demo);background:var(--demo-soft);border:1px solid transparent;border-radius:99px;padding:3px 9px;cursor:pointer}
.live-tag{display:inline-flex;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:3px 9px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px dashed var(--demo);background:var(--demo-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px}
.banner b{color:var(--demo)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.acc .v{color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end}
.filters label,.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.filters select,.filters input{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.form .full{grid-column:1/-1}
.form label > *{color:var(--fg);font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px dotted var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td select{min-height:30px;padding:3px 6px;font-size:13px;max-width:170px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-on_time,.c-present{color:var(--ok);background:var(--ok-soft)}
.c-late{color:var(--warn);background:var(--warn-soft)}
.c-absent,.c-not_in,.c-High{color:var(--bad);background:var(--bad-soft)}
.c-scheduled,.c-unassigned,.c-Low{color:var(--idle);background:var(--idle-soft)}
.c-Medium{color:var(--warn);background:var(--warn-soft)}
.c-out{color:var(--muted);background:var(--sunk)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .nm{font-weight:600}
.card .acts{display:flex;flex-wrap:wrap;gap:6px}
.sep{border:0;border-top:1px dotted var(--muted);opacity:.5;margin:4px 0}
.bulk{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.bulk select{background:var(--bg);color:var(--fg);border-color:transparent}
.bulk .btn:not(.pri){background:transparent;color:var(--bg);border-color:var(--bg)}
#modal{position:fixed;inset:0;z-index:20;background:rgb(10 6 8 / .45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(620px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;z-index:30;inset-inline-start:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;max-width:calc(100% - 32px)}
html[dir="rtl"] #toast{transform:translateX(50%)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.legend ul{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.auth-side{background:var(--ink);color:var(--ink-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.auth-side .tri{position:absolute;inset-inline-end:-14%;top:50%;transform:translateY(-50%);width:62%;aspect-ratio:1/2;max-width:100%;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);opacity:.95}
.auth-side h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,7vw,88px);line-height:.92;letter-spacing:-.03em;position:relative;margin:0}
.auth-side h1 em{font-style:normal;color:var(--accent)}
.auth-side .meta{position:relative;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.auth-form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.auth-form img{height:48px;width:auto;align-self:flex-start}
.auth-form h2{font-size:28px;font-weight:900}
.auth-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.auth-form input{min-height:48px!important;font-size:16px;border-width:1.5px!important;text-transform:none;letter-spacing:0}
.auth-form input:focus{border-color:var(--fg)!important;outline:none}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-inline-end:48px}
.pw button{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:40px;height:40px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.auth-form .go{min-height:50px;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;justify-content:center}
@media (max-width:760px){.auth{grid-template-columns:1fr}.auth-side{padding-block:32px;min-height:220px}.auth-side .tri{width:40%}.auth-side h1{font-size:44px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,border-color .15s}}
@media (max-width:560px){header.top{position:static} .ctrls{order:3;width:100%} .brand img{height:22px} .brand b{font-size:13px} .kpi .v{font-size:28px} h2{font-size:21px}}
</style>

async function saveFile(filename,blob){
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});toast(t('Saved')+': '+filename)}catch(e){if(e&&e.code!=='declined')toast('Could not save the file here ('+(e.code||'error')+').')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function xlsx(filename,sheets){
  if(!window.XLSX){toast('Excel library failed to load. Check the connection.');return}
  const wb=XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(sheets)){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Note:'No rows'}]);
    const keys=Object.keys(rows[0]||{Note:1});ws['!cols']=keys.map(k=>({wch:Math.min(42,Math.max(k.length,...rows.map(r=>String(r[k]??'').length))+2)}));
    XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));}
  saveFile(filename,new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
}
/* Minimal PDF style: one accent, generous margins, dotted separators */
const PDF={L:18,R:192,ink:[20,20,20],mut:[102,100,98],acc:[227,23,29],dot:[170,168,165]};
const pdfSafe=v=>String(v??'').replace(/[–—]/g,'-').replace(/[^\x00-\xFF]/g,'?');
function pdfDot(doc,y){doc.setLineDashPattern([0.25,1.1],0);doc.setDrawColor(...PDF.dot);doc.setLineWidth(0.3);doc.line(PDF.L,y,PDF.R,y);doc.setLineDashPattern([],0)}
function pdfStart(title,sub){
  if(!window.jspdf){toast('PDF library failed to load. Check the connection.');return null}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  try{doc.addImage(LOGO,'PNG',PDF.L,13,36,36*140/640)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...PDF.acc);doc.setCharSpace(0.8);doc.text('ITU FIELD OPS 2026',PDF.R,19,{align:'right'});doc.setCharSpace(0);
  doc.setFont('helvetica','normal');doc.setFontSize(19);doc.setTextColor(...PDF.ink);doc.text(pdfSafe(title),PDF.L,31);
  doc.setFontSize(9);doc.setTextColor(...PDF.mut);doc.text(pdfSafe(sub),PDF.L,38);
  pdfDot(doc,45);doc._y=55;return doc;
}
function pdfSection(doc,label){if(doc._y>262){doc.addPage();doc._y=22}doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...PDF.mut);doc.setCharSpace(0.6);doc.text(pdfSafe(label.toUpperCase()),PDF.L,doc._y);doc.setCharSpace(0);doc._y+=4}
function pdfKpis(doc,items){
  const w=(PDF.R-PDF.L)/Math.min(items.length,6);items.forEach((it,i)=>{const row=Math.floor(i/6),x=PDF.L+(i%6)*w,y=doc._y+row*17;
    doc.setFont('helvetica','normal');doc.setFontSize(18);doc.setTextColor(...(it.c||PDF.ink));doc.text(String(it.v),x,y+7);
    doc.setFontSize(7.5);doc.setTextColor(...PDF.mut);doc.text(pdfSafe(it.l),x,y+12)});
  doc._y+=Math.ceil(items.length/6)*17+2;pdfDot(doc,doc._y);doc._y+=9;
}
function pdfTable(doc,head,body){
  if(!body.length){doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(...PDF.mut);doc.text('None',PDF.L,doc._y+4);doc._y+=14;return}
  doc.autoTable({startY:doc._y,head:[head.map(pdfSafe)],body:body.map(r=>r.map(pdfSafe)),theme:'plain',margin:{left:PDF.L,right:210-PDF.R,top:20,bottom:22},
    styles:{font:'helvetica',fontSize:8.5,textColor:PDF.ink,cellPadding:{top:2.4,bottom:2.4,left:1.2,right:2}},
    headStyles:{fontStyle:'bold',fontSize:7,textColor:PDF.mut},
    didDrawCell:d=>{if(d.column.index===0){const y=d.cell.y+d.cell.height;d.doc.setLineDashPattern([0.25,1.1],0);d.doc.setDrawColor(...(d.section==='head'?PDF.mut:PDF.dot));d.doc.setLineWidth(d.section==='head'?0.35:0.25);d.doc.line(PDF.L,y,PDF.R,y);d.doc.setLineDashPattern([],0)}}});
  doc._y=doc.lastAutoTable.finalY+11;
}
function pdfFinish(doc,filename){
  const n=doc.getNumberOfPages(),stamp='Generated '+tsFmt(new Date().toISOString())+' (Doha) by '+actor();
  for(let i=1;i<=n;i++){doc.setPage(i);pdfDot(doc,282);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...PDF.mut);
    doc.text(pdfSafe('DECC, Doha · 9-27 November 2026 · '+stamp+(S.source==='sample'||S.demoScenario?' · DEMO DATA':'')),PDF.L,287);doc.text(`${i} / ${n}`,PDF.R,287,{align:'right'})}
  saveFile(filename,doc.output('blob'));
}

/* ---------- Dashboard ---------- */
function dayStats(date,list){
  const c={total:0,on_time:0,late:0,absent:0,not_in:0,scheduled:0,onduty:0,out:0};
  for(const s of list){const st=statusOf(s,date);if(st.k==='unassigned')continue;c.total++;c[st.k]++;if(st.r&&st.r.in&&!st.r.out)c.onduty++;if(st.r&&st.r.out)c.out++}
  return c;
}
function kpiTiles(c,inc){const k=(key,cls,v,l)=>`<button class="kpi ${cls}" data-act="kpi" data-v="${key}"><span class="v">${v}</span><span class="l">${t(l)}</span></button>`;
  return `<div class="kpis">${k('total','acc',c.total,'Assigned')}${k('onduty','',c.onduty,'On duty now')}${k('on_time','ok',c.on_time,'On time')}${k('late','warn',c.late,'Late')}${k('absent','bad',c.absent,'Absent')}${k('not_in','bad',c.not_in,'Not checked in')}${k('out','',c.out,'Checked out')}

function attRows(){const f=ui.f.att,q=f.q.trim().toLowerCase(),from=f.from||ui.day,to=f.to||from,out=[];
  for(const d of DAYS){if(d<from||d>to)continue;
    for(const s of S.staff){const st=statusOf(s,d);if(st.k==='unassigned')continue;
      if(q&&!s.name.toLowerCase().includes(q)&&!s.code.toLowerCase().includes(q))continue;
      if(f.sup&&s.sup!==f.sup&&s.id!==f.sup)continue;if(f.dept&&s.dept!==f.dept)continue;if(f.shift&&st.sh?.id!==f.shift)continue;
      if(f.status&&(f.status==='out'?!(st.r&&st.r.out):f.status==='onduty'?!(st.r&&st.r.in&&!st.r.out):st.k!==f.status))continue;
      const tin=st.r?.in||'';if((f.tf||f.tt)&&(!tin||(f.tf&&tin<f.tf)||(f.tt&&tin>f.tt)))continue;
      out.push({d,s,st});}}
  return out;
}

function readImport(file){const rd=new FileReader();rd.onload=()=>{try{

  if(!kName){toast('No name column found. Use the template headings.');return}
  const warn=[],cnt={Supervisor:0,Marshal:0},rows=json.filter(r=>String(r[kName]).trim()).map(r=>{const role=/super|مشرف/i.test(String(kRole?r[kRole]:''))?'Supervisor':'Marshal';cnt[role]++;

  const nm=rows.filter(r=>r.role==='Marshal').length,ns=rows.length-nm;

    case 'att-xlsx':xlsx(`ITU-FieldOps-Attendance-${ui.f.att.from||ui.day}.xlsx`,{Attendance:attExportRows(attRows())});break;
    case 'att-pdf':{const rows=attRows(),f=ui.f.att,from=f.from||ui.day,to=f.to||from;const doc=pdfStart('Attendance Report',(from===to?fmtEn(from):fmtEn(from)+' to '+fmtEn(to))+' · '+rows.length+' records');if(!doc)break;
      const cnt=k=>rows.filter(r=>r.st.k===k).length;pdfKpis(doc,[{v:rows.length,l:'Records',c:PDF.acc},{v:cnt('on_time'),l:'On time'},{v:cnt('late'),l:'Late'},{v:cnt('absent'),l:'Absent'},{v:cnt('not_in'),l:'Not checked in'},{v:cnt('scheduled'),l:'Scheduled'}]);
      const fl=[f.sup&&'Supervisor: '+supName(f.sup),f.dept&&'Department: '+f.dept,f.shift&&'Shift: '+shiftById(f.shift)?.name,f.status&&'Status: '+(STATUS_LABEL[f.status]||f.status),(f.tf||f.tt)&&`Check-in ${f.tf||'..'}-${f.tt||'..'}`,f.q&&'Search: '+f.q].filter(Boolean);
      if(fl.length){doc.setFontSize(8);doc.setTextColor(...PDF.mut);doc.text(pdfSafe('Filters: '+fl.join(' · ')),PDF.L,doc._y-3);doc._y+=4}
      pdfTable(doc,['Date','ID','Name','Supervisor','Dept','Shift','In','Out','Late','Status'],rows.map(({d,s,st})=>[d.slice(5),s.code,s.name,s.role==='Marshal'?supName(s.sup):'-',s.dept,st.sh?.name||'',st.r?.in||'',st.r?.out||'',st.late?'+'+st.late:'',STATUS_LABEL[st.k]]));
      pdfFinish(doc,`ITU-FieldOps-Attendance-${from}${to!==from?'_'+to:''}.pdf`);break}
    case 'staff-xlsx':xlsx('ITU-FieldOps-Staff.xlsx',{Staff:staffRows().map(s=>({'Employee ID':s.code,Name:s.name,Role:s.role,Supervisor:supName(s.sup),Department:s.dept,Shift:shLabel(shiftOf(s,ui.day)),Phone:s.phone,QID:s.qid||'',Nationality:s.nat||''}))});break;
    case 'staff-pdf':{const rows=staffRows(),doc=pdfStart('Staff & Assignments',`${rows.length} staff · as of ${fmtEn(ui.day)}`);if(!doc)break;
      pdfTable(doc,['ID','Name','Role','Supervisor','Department','Shift'],rows.map(s=>[s.code,s.name,s.role,supName(s.sup)||'-',s.dept||'-',shLabel(shiftOf(s,ui.day))||'-']));pdfFinish(doc,'ITU-FieldOps-Staff.pdf');break}
    case 'inc-xlsx':xlsx('ITU-FieldOps-Incidents.xlsx',{Incidents:incExportRows(incList())});break;
    case 'inc-pdf':{const l=incList(),doc=pdfStart('Incident Log',`${l.length} incidents`);if(!doc)break;pdfTable(doc,['Date','Time','Category','Severity','Department','Description','By'],l.map(i=>[i.date.slice(5),i.time,i.cat,i.sev,i.dept,i.desc,i.by]));pdfFinish(doc,'ITU-FieldOps-Incidents.pdf');break}
    case 'sc-xlsx':xlsx('ITU-FieldOps-Shift-Changes.xlsx',{'Shift changes':scExportRows()});break;
    case 'sc-pdf':{const l=shiftLog(),doc=pdfStart('Shift Change Audit Record',`${l.length} changes · each approved by ${APPROVER} by email`);if(!doc)break;pdfTable(doc,['Recorded','Staff','From','To','Effective','Email date','Reference','By'],l.map(a=>[tsFmt(a.ts),a.staffCode+' '+a.staffName,a.fromShift,a.toShift,a.effective,a.emailDate,a.emailRef,a.by]));pdfFinish(doc,'ITU-FieldOps-Shift-Changes.pdf');break}
    case 'audit-xlsx':xlsx('ITU-FieldOps-Audit-Log.xlsx',{'Audit log':auditList().map(a=>({Recorded:tsFmt(a.ts),Type:a.type,Detail:a.detail,By:a.by}))});break;
    case 'audit-pdf':{const l=auditList(),doc=pdfStart('Audit Log',`${l.length} entries`);if(!doc)break;pdfTable(doc,['Recorded','Type','Detail','By'],l.map(a=>[tsFmt(a.ts),a.type,a.detail,a.by]));pdfFinish(doc,'ITU-FieldOps-Audit-Log.pdf');break}
    case 'tpl':xlsx('ITU-FieldOps-Staff-Template.xlsx',{Staff:[{'Employee ID':'SUP-01','Full Name':'Example Supervisor','Role':'Supervisor','Phone':'+974 5000 0000'},{'Employee ID':'MAR-001','Full Name':'Example Marshal','Role':'Marshal','Phone':'+974 5000 0001'}]});break;
    case 'imp-cancel':ui.importPreview=null;render();break;
    case 'imp-go':confirmBox(ui.lang==='ar'?'سيتم استبدال قائمة الموظفين وحذف الحضور والحوادث الحالية. هل تريد المتابعة؟':'This replaces the staff list and clears current attendance and incidents. Continue?',()=>{const p=ui.importPreview,keep={departments:S.departments,shifts:S.shifts,settings:S.settings,audit:S.audit};
      S=freshState(p.rows.map(r=>({id:uid(),...r,sup:'',dept:'',shifts:[]})),'import');Object.assign(S,keep);ui.role='pm';Prefs.set('role','pm');
      log('Import',`${p.rows.length} staff imported from ${p.file} (all unassigned)`);ui.importPreview=null;save();render();toast(t('Saved'))});break;
    case 'demo':if(LIVE)break;confirmBox(ui.lang==='ar'?'سيتم استبدال التوزيع الحالي ببيانات وهمية. متابعة؟':'This replaces current assignments and attendance with fake demo data. Continue?',loadDemo);break;
    case 'reset-sample':if(LIVE)break;confirmBox(ui.lang==='ar'?'إعادة القائمة النموذجية: 68 موظفاً غير موزَّعين وبدون سجلات.':'Reset to the clean sample: 68 unassigned staff, no records.',()=>{S=freshState(sampleStaff(),'sample');ui.role='pm';Prefs.set('role','pm');save();render()});break;
    case 'signout':try{history.replaceState(null,'','#')}catch(e){}Prefs.set('tab','');Cloud.auth.signOut().then(()=>location.reload());break;
    case 'acc-save':if(LIVE&&pm)setAccount(id);break;
    case 'acc-del':if(LIVE&&pm)confirmBox(ui.lang==='ar'?'سيتم إيقاف دخول هذا المشرف. متابعة؟':'This supervisor will no longer be able to sign in. Continue?',()=>delAccount(id));break;
    case 'auth-in':case 'auth-up':case 'auth-reset':authAction(a);break;
    case 'dept-add':{const v2=$('#new-dept').value.trim();if(v2&&!S.departments.includes(v2)){S.departments.push(v2);log('Settings','Department added: '+v2);save();render()}break}
    case 'dept-del':{if(S.staff.some(s=>s.dept===v)){toast('Staff are assigned to this department.');break}S.departments=S.departments.filter(d=>d!==v);log('Settings','Department removed: '+v);save();render();break}
    case 'shift-add':{const ids='ABCDEFGHIJ'.split('').filter(x=>!S.shifts.some(s=>s.id===x));if(!ids.length)break;S.shifts.push({id:ids[0],name:'New shift',start:'09:00',end:'17:00'});log('Settings','Shift added: '+ids[0]);save();render();break}
  }
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.actChange==='day'){ui.day=el.value;render();return}
  if(el.dataset.actChange==='role'){ui.role=el.value;Prefs.set('role',el.value);ui.tab='';ui.annShown='';render();setTimeout(annPopup,200);return}
  if(el.dataset.assign&&ui.role==='pm'){const s=byId(el.dataset.id);if(assign(s,el.dataset.assign,el.value)){save();toast(t('Saved'));$('#res-staff').innerHTML=RES.staff()}return}
  if(el.id==='imp-file'&&el.files[0]){if(!window.XLSX){toast('Excel library failed to load.');return}readImport(el.files[0]);return}
  if(el.id==='set-grace'){const g=Math.max(0,Math.min(120,parseInt(el.value,10)||0));S.settings.grace=g;log('Settings','Grace period: '+g+' min');save();toast(t('Saved'));return}
  if(el.dataset.shift){const x=shiftById(el.dataset.shift);if(x&&el.value){x[el.dataset.k]=el.value;log('Settings',`Shift ${x.id} ${el.dataset.k}: ${el.value}`);save();toast(t('Saved'))}return}
  if(el.id==='sc-staff'){ui.scStaff=el.value;const s=byId(el.value);$('#sc-cur').value=s?shLabel(shiftOf(s,$('#sc-eff').value||ui.day)):'';return}
  if(el.dataset.f&&el.tagName==='SELECT'||el.dataset.f&&(el.type==='date'||el.type==='time'))filterInput(el);
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&(el.type==='search'||el.type==='text'))filterInput(el)});
document.addEventListener('submit',e=>{if(e.target.id==='sc-form')submitShift(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function filterInput(el){const [scope,key]=el.dataset.f.split('.');ui.f[scope][key]=el.value;const box=$('#res-'+scope);if(box)box.innerHTML=RES[scope]()}
/* ---------- Live sign-in ---------- */
function signInView(){return `<div class="auth">
  <div class="auth-side"><div class="tri" aria-hidden="true"></div><div class="meta">ITU 2026 · DECC Doha</div>
   <h1>FIELD<br>OPS<br><em>2026</em></h1><div class="meta">9–27 November</div></div>
  <div class="auth-main"><form class="auth-form" id="auth-form" autocomplete="on">
   ${logoImg(44)}
   <h2>${ui.lang==='ar'?'تسجيل الدخول':'Sign in'}</h2>
   <label>${t('Username')}<input type="text" autocomplete="username" autocapitalize="none" spellcheck="false" id="au-email" value="${esc(ui.authEmail||'')}"></label>
   <label>${t('Password')}<span class="pw"><input type="password" autocomplete="current-password" id="au-pass"><button type="button" data-act="pw-eye" aria-label="Show password">${ICON.eye}</button></span></label>
   ${ui.authMsg?`<div class="small" style="color:var(--bad)">${esc(ui.authMsg)}</div>`:''}
   <button class="btn pri go" type="submit">${ui.lang==='ar'?'دخول':'Sign in'}</button>
   <div class="small muted">${ui.lang==='ar'?'نسيت كلمة السر؟ اطلب من مدير المشروع كلمة جديدة.':'Forgot your password? Ask the Project Manager for a new one.'}</div>
   <div class="row between"><button class="btn ghost sm" type="button" data-act="auth-up">Project Manager: first sign-in</button><button class="btn ghost sm" type="button" data-act="lang">${ui.lang==='ar'?'English':'العربية'}</button></div>
  </form></div></div>`}
async function authAction(kind){const raw=($('#au-email').value||'').trim().toLowerCase(),pw=$('#au-pass').value;let em=toEmail(raw);ui.authEmail=raw;ui.authMsg='';
  try{if(!raw||!pw)throw{message:'Enter your username and password.'};
    if(kind==='auth-up'){if(!PM_EMAILS.includes(em))throw{message:'Only the Project Manager creates a password here. Supervisors get theirs from the Project Manager.'};if(pw.length<8)throw{message:'Use at least 8 characters for the password.'};await Cloud.auth.createUserWithEmailAndPassword(em,pw);return}
    if(!raw.includes('@')&&!PM_EMAILS.includes(em)){const d=await Cloud.db.collection('logins').doc(raw).get();if(d.exists)em=d.data().email}
    Cloud.uname=raw;
    await Cloud.auth.signInWithEmailAndPassword(em,pw);
  }catch(e){const c=e.code||'';ui.authMsg=c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?(PM_EMAILS.includes(em)?'Username or password is wrong. First time here? Tap "Project Manager: first sign-in" to create your password.':'Username or password is wrong.'):c.includes('operation-not-allowed')?'Email/Password sign-in is not enabled in Firebase Authentication.':c.includes('email-already-in-use')?'This username already has a password. Sign in, or ask the Project Manager to reset it.':c.includes('invalid-email')?'Use letters, numbers, dots or dashes in the username.':c.includes('too-many-requests')?'Too many attempts. Wait a few minutes.':(e.message||'Sign-in failed.');render()}}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();authAction('auth-in')}});
async function bootLive(){
  firebase.initializeApp(FIREBASE_CONFIG);Cloud.auth=firebase.auth();Cloud.db=firebase.firestore();
  try{await Cloud.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  Cloud.auth.onAuthStateChanged(async u=>{Cloud.unsubs.forEach(f=>f());Cloud.unsubs=[];Cloud.loaded.clear();Cloud.synced={};Cloud.priv=new Map();Cloud.access=new Map();Cloud.initDone=false;S={...freshState([],'live'),audit:[]};
    ui.authReady=true;if(!u){ui.role='';render();return}
    const em=(u.email||'').toLowerCase();Cloud.email=em;
    if(PM_EMAILS.includes(em))ui.role='pm';
    else{try{const d=await Cloud.db.collection('access').doc(em).get();ui.role=d.exists&&d.data().role==='supervisor'?d.data().staffId:'';if(d.exists&&d.data().username)Cloud.uname=d.data().username}catch(e){ui.role=''}
      if(!ui.role){ui.authMsg=ui.lang==='ar'?'هذا الحساب غير مفعّل. اطلب من مدير المشروع حساباً جديداً.':'This account is not active. Ask the Project Manager for a new one.';await Cloud.auth.signOut();return}}
    ui.authMsg='';render();Cloud.start()});
}
/* Live refresh: statuses like "Not checked in" change with the clock */
setInterval(()=>{if((!LIVE||ui.role)&&$('#modal').hidden&&!document.activeElement?.matches('input,select,textarea')&&['dash','team','rep'].includes(ui.tab))render()},60000);
{const h=location.hash.slice(1)||Prefs.get('tab','');if(h)ui.tab=h}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==ui.tab){ui.tab=h;render()}});
if(LIVE)bootLive();
render();if(!LIVE)setTimeout(annPopup,300);
</script>
