/* Layout: an operations console. Sticky header with the operating day, tab rail, then dense tables and cards. One column on phones. */
:root{

  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:8px;
}

  --bg:#131012; --surface:#1c181a; --sunk:#252022; --fg:#f0eaec; --muted:#a69a9f; --line:#342d30;

  --ok:#62c48f; --ok-soft:#173226; --warn:#e5ab52; --warn-soft:#382a12; --bad:#f2877c; --bad-soft:#3d1c19; --idle:#a3aab5; --idle-soft:#262a30;
  --demo:#b7a2f2; --demo-soft:#2a2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131012; --surface:#1c181a; --sunk:#252022; --fg:#f0eaec; --muted:#a69a9f; --line:#342d30;
  --accent:#e7829d; --accent-ink:#1c0910; --accent-soft:#3a1a25;
  --ok:#62c48f; --ok-soft:#173226; --warn:#e5ab52; --warn-soft:#382a12; --bad:#f2877c; --bad-soft:#3d1c19; --idle:#a3aab5; --idle-soft:#262a30;
  --demo:#b7a2f2; --demo-soft:#2a2240; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}

.brand{display:flex;flex-direction:column;line-height:1.05;margin-inline-end:auto}

.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=time],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px;max-width:100%}
textarea{width:100%;min-height:80px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn.bad{color:var(--bad);border-color:var(--bad)}

main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}

.kpi{box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}

.c-on_time,.c-present{color:var(--ok);background:var(--ok-soft)}
.c-late{color:var(--warn);background:var(--warn-soft)}
.c-absent,.c-not_in,.c-High{color:var(--bad);background:var(--bad-soft)}
.c-scheduled,.c-unassigned,.c-Low{color:var(--idle);background:var(--idle-soft)}

.sep{border:0;border-top:1px dotted var(--muted);opacity:.5;margin:4px 0}
.bulk{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.bulk select{background:var(--bg);color:var(--fg);border-color:transparent}
#modal{position:fixed;inset:0;z-index:20;background:rgb(10 6 8 / .45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(620px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.legend ul{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

async function saveFile(filename,blob){

function xlsx(filename,sheets){

/* Minimal PDF style: one accent, generous margins, dotted separators */
const PDF={L:18,R:192,ink:[30,26,28],mut:[112,102,106],acc:[138,21,56],dot:[176,166,170]};

function pdfKpis(doc,items){
  const w=(PDF.R-PDF.L)/Math.min(items.length,6);items.forEach((it,i)=>{const row=Math.floor(i/6),x=PDF.L+(i%6)*w,y=doc._y+row*17;
    doc.setFont('helvetica','normal');doc.setFontSize(18);doc.setTextColor(...(it.c||PDF.ink));doc.text(String(it.v),x,y+7);
    doc.setFontSize(7.5);doc.setTextColor(...PDF.mut);doc.text(pdfSafe(it.l),x,y+12)});

function pdfTable(doc,head,body){

  doc.autoTable({startY:doc._y,head:[head.map(pdfSafe)],body:body.map(r=>r.map(pdfSafe)),theme:'plain',margin:{left:PDF.L,right:210-PDF.R,top:20,bottom:22},

function assign(s,field,val,quiet){
  if(field==='sup'){if(s.role!=='Marshal')return false;s.sup=val;log('Assignment',`${s.code} ${s.name} → supervisor: ${supName(val)||'none'}`)}
  if(field==='dept'){s.dept=val;log('Assignment',`${s.code} ${s.name} → department: ${val||'none'}`)}
  if(field==='shift'){if(s.shifts.length||!val)return false;s.shifts=[{id:val,from:EVENT_START}];log('Assignment',`${s.code} ${s.name} → initial shift: ${shLabel(shiftById(val))}`)}
  return true;
}

/* ---------- Attendance ---------- */
function attRows(){const f=ui.f.att,q=f.q.trim().toLowerCase(),from=f.from||ui.day,to=f.to||from,out=[];
  for(const d of DAYS){if(d<from||d>to)continue;
    for(const s of S.staff){const st=statusOf(s,d);if(st.k==='unassigned')continue;
      if(q&&!s.name.toLowerCase().includes(q)&&!s.code.toLowerCase().includes(q))continue;
      if(f.sup&&s.sup!==f.sup&&s.id!==f.sup)continue;if(f.dept&&s.dept!==f.dept)continue;if(f.shift&&st.sh?.id!==f.shift)continue;
      if(f.status&&(f.status==='out'?!(st.r&&st.r.out):f.status==='onduty'?!(st.r&&st.r.in&&!st.r.out):st.k!==f.status))continue;
      const tin=st.r?.in||'';if((f.tf||f.tt)&&(!tin||(f.tf&&tin<f.tf)||(f.tt&&tin>f.tt)))continue;
      out.push({d,s,st});}}
  return out;
}
const attExportRows=rows=>rows.map(({d,s,st})=>({Date:d,'Employee ID':s.code,Name:s.name,Role:s.role,Supervisor:s.role==='Marshal'?supName(s.sup):'',Department:s.dept,Shift:shLabel(st.sh),'Check in':st.r?.in||'','Check out':st.r?.out||'','Late (min)':st.late||'',Status:STATUS_LABEL[st.k],'Recorded by':st.r?.by||'',Note:st.r?.note||''}));
VIEWS.att=()=>{const f=ui.f.att;return `<div class="row between"><h2>${t('Attendance')}</h2><div class="row"><button class="btn" data-act="att-xlsx">${t('Export Excel')}</button><button class="btn" data-act="att-pdf">${t('Export PDF')}</button></div></div>

  <label>${t('Date to')}<input type="date" data-f="att.to" min="${EVENT_START}" max="${EVENT_END}" value="${esc(f.to||f.from||ui.day)}"></label>
  ${fInp('att','tf','Check-in from','time')}${fInp('att','tt','Check-in to','time')}${fInp('att','q','Search name or ID','search')}
  ${fSel('att','sup','Supervisor',supOptions(f.sup,t('All')))}${fSel('att','dept','Department',deptOptions(f.dept,t('All')))}${fSel('att','shift','Shift',shiftOptions(f.shift,t('All')))}
  ${fSel('att','status','Status',opt('',t('All'),f.status)+['on_time','late','absent','not_in','scheduled'].map(k=>opt(k,t(STATUS_LABEL[k]),f.status)).join('')+opt('onduty',t('On duty now'),f.status)+opt('out',t('Checked out'),f.status))}
  <button class="btn ghost" data-act="clear-f" data-v="att">${t('Clear filters')}</button></div>
  <div id="res-att">${RES.att()}</div>`};
RES.att=()=>{const rows=attRows(),shown=rows.slice(0,400);
  if(!rows.length)return `<div class="panel empty">${S.staff.some(s=>s.shifts.length)?t('Nothing matches these filters.'):(ui.lang==='ar'?'لا أحد لديه وردية بعد. وزّع الورديات أولاً.':'Nobody has a shift yet. Assign shifts in Staff & assignment first.')}</div>`;

  ${shown.map(({d,s,st})=>`<tr class="click" data-act="att-edit" data-id="${s.id}" data-d="${d}"><td class="mono small">${d.slice(5)}</td><td class="mono">${esc(s.code)}</td><td>${esc(s.name)}</td><td>${esc(s.role==='Marshal'?supName(s.sup):'—')}</td><td>${esc(s.dept)}</td><td class="small">${esc(st.sh?.name||'')}</td><td class="mono">${esc(st.r?.in||'')}</td><td class="mono">${esc(st.r?.out||'')}</td><td class="num mono">${st.late||''}</td><td>${chip(st.k)}</td></tr>`).join('')}
  </tbody></table></div>`};
function attEdit(id,d){const s=byId(id),r=S.att[d+'|'+id]||{};
  modal(`<h2>${t('Edit attendance')}</h2><div class="muted">${esc(s.code)} · ${esc(s.name)} · ${esc(fmtEn(d))}</div>
  <div class="form"><label>${t('In')}<input type="time" id="e-in" value="${esc(r.in||'')}"></label><label>${t('Out')}<input type="time" id="e-out" value="${esc(r.out||'')}"></label>
  <label>${t('Status')}<select id="e-abs">${opt('0',t('Present')||'Present',r.absent?'1':'0')}${opt('1',t('Absent'),r.absent?'1':'0')}</select></label>
  <label class="full">${t('Notes')}<input type="text" id="e-note" value="${esc(r.note||'')}" placeholder="Reason for correction"></label></div>
  <div class="row between"><button class="btn bad" id="e-clear">${t('Clear record')}</button><div class="row"><button class="btn" data-act="close">${t('Cancel')}</button><button class="btn pri" id="e-save">${t('Save')}</button></div></div>`);
  $('#e-save').onclick=()=>{const abs=$('#e-abs').value==='1',inn=$('#e-in').value,out=$('#e-out').value;
    if(!abs&&!inn){toast('Enter a check-in time or mark absent.');return}
    S.att[d+'|'+id]={in:abs?'':inn,out:abs?'':out,absent:abs,note:$('#e-note').value.trim(),by:actor(),at:new Date().toISOString()};
    log('Attendance correction',`${s.code} ${s.name} ${d}: ${abs?'absent':`in ${inn}${out?' out '+out:''}`}${$('#e-note').value.trim()?' · '+$('#e-note').value.trim():''}`);save();closeModal();render();toast(t('Saved'))};
  $('#e-clear').onclick=()=>{delete S.att[d+'|'+id];log('Attendance correction',`${s.code} ${s.name} ${d}: record cleared`);save();closeModal();render()};
}

VIEWS.team=()=>{const me=byId(ui.role),team=S.staff.filter(m=>m.sup===ui.role).sort((a,b)=>a.code.localeCompare(b.code)),c=dayStats(ui.day,team);
  return `<div class="row between"><h2>${t('My team')} · ${t('Day')} ${dayNo(ui.day)}, ${esc(fmtD(ui.day))}</h2><span class="muted small">${esc(me.name)}${me.dept?' · '+esc(me.dept):''}</span></div>

  ${team.length?`<div class="cards">${team.map(m=>{const st=statusOf(m,ui.day),r=st.r;
    return `<div class="card"><div class="row between"><div style="min-width:0"><div class="nm">${esc(m.name)}</div><div class="small muted"><span class="mono">${esc(m.code)}</span> · ${esc(st.sh?shLabel(st.sh):t('Unassigned'))}${m.dept?' · '+esc(m.dept):''}</div></div>${chip(st.k)}</div>
      ${r&&(r.in||r.out)?`<div class="small mono">${t('In')} ${esc(r.in||'—')} · ${t('Out')} ${esc(r.out||'—')}${st.late?` · +${st.late} min`:''}</div>`:''}
      <div class="acts">${!st.sh?'':!r?`<button class="btn ok sm" data-act="ci" data-id="${m.id}">${t('Check in')}</button><button class="btn bad sm" data-act="abs" data-id="${m.id}">${t('Mark absent')}</button>`
        :r.absent?`<button class="btn sm" data-act="undo" data-id="${m.id}">${t('Undo')}</button>`
        :!r.out?`<button class="btn pri sm" data-act="co" data-id="${m.id}">${t('Check out')}</button><button class="btn sm ghost" data-act="undo" data-id="${m.id}">${t('Undo')}</button>`
        :`<button class="btn sm ghost" data-act="undo-out" data-id="${m.id}">${t('Undo')}</button>`}</div></div>`}).join('')}</div>`:`<div class="panel empty">${t('No marshals are assigned to you yet.')}</div>`}`};
function recTime(){return ($('#rec-time')&&$('#rec-time').value)||doha().time}
function mark(id,kind){const s=byId(id),k=ui.day+'|'+id,tm=recTime();const r=S.att[k];
  if(LIVE&&ui.role!=='pm'&&ui.day!==doha().date){toast(ui.lang==='ar'?'يمكنك تسجيل الحضور لليوم الحالي فقط.':'You can record attendance for today only.');return}
  if(kind==='ci'){S.att[k]={in:tm,out:'',absent:false,by:actor(),at:new Date().toISOString()};log('Check in',`${s.code} ${s.name} ${ui.day} ${tm}`)}
  if(kind==='co'&&r){if(tm<r.in&&!(shiftOf(s,ui.day)&&toMin(shiftOf(s,ui.day).end)<=toMin(shiftOf(s,ui.day).start))){toast('Check-out time is before check-in.');return}r.out=tm;log('Check out',`${s.code} ${s.name} ${ui.day} ${tm}`)}
  if(kind==='abs'){S.att[k]={in:'',out:'',absent:true,by:actor(),at:new Date().toISOString()};log('Absent',`${s.code} ${s.name} ${ui.day}`)}
  if(kind==='undo'){delete S.att[k];log('Undo',`${s.code} ${s.name} ${ui.day}: record removed`)}
  if(kind==='undo-out'&&r){r.out='';log('Undo',`${s.code} ${s.name} ${ui.day}: check-out removed`)}
  save();const keep=$('#rec-time')?.value;render();if(keep&&$('#rec-time'))$('#rec-time').value=keep;
}

function incList(){const f=ui.f.inc,q=f.q.trim().toLowerCase();
  return S.incidents.filter(i=>(ui.role==='pm'||i.byId===ui.role)&&(!f.from||i.date>=f.from)&&(!f.to||i.date<=f.to)&&(!f.dept||i.dept===f.dept)&&(!f.sev||i.sev===f.sev)&&(!f.cat||i.cat===f.cat)&&(!f.sup||i.byId===f.sup)
    &&(!q||(i.desc+' '+(byId(i.staff)?.name||'')+' '+i.by).toLowerCase().includes(q))).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}

async function setAccount(id){const s=byId(id),raw=($('#acc-'+id).value||'').trim().toLowerCase(),pw=$('#pw-'+id).value;

  try{if(!Cloud.second){Cloud.second=firebase.initializeApp(FIREBASE_CONFIG,'accounts');try{await Cloud.second.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)}catch(e){}}

    return {code:String(kId?r[kId]:'').trim()||(role==='Supervisor'?'SUP-'+String(cnt[role]).padStart(2,'0'):'MAR-'+String(cnt[role]).padStart(3,'0')),name:String(r[kName]).replace(/\s+/g,' ').trim(),role,phone:String(kPhone?r[kPhone]:'').trim(),qid:String(kQid?r[kQid]:'').trim(),nat:String(kNat?r[kNat]:'').trim()}});

function loadDemo(){const r=rng(9),sp=sups(),mar=S.staff.filter(s=>s.role==='Marshal'),n=doha();

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(el.tagName==='SELECT')return;
  const pm=ui.role==='pm';
  switch(a){
    case 'tab':ui.tab=v;ui.sel.clear();render();window.scrollTo(0,0);break;
    case 'lang':ui.lang=ui.lang==='ar'?'en':'ar';Prefs.set('lang',ui.lang);render();break;
    case 'legend':legend();break;
    case 'close':closeModal();break;
    case 'clear-f':for(const k in ui.f[v])ui.f[v][k]='';render();break;
    case 'sel':if(el.checked)ui.sel.add(id);else ui.sel.delete(id);$('#res-staff').innerHTML=RES.staff();break;
    case 'sel-all':staffRows().forEach(s=>el.checked?ui.sel.add(s.id):ui.sel.delete(s.id));$('#res-staff').innerHTML=RES.staff();break;
    case 'sel-none':ui.sel.clear();$('#res-staff').innerHTML=RES.staff();break;
    case 'bulk':{if(!pm)return;const bs=$('#b-sup').value,bd=$('#b-dept').value,bh=$('#b-shift').value;let skipped=0,n=0;
      for(const sid of ui.sel){const s=byId(sid);if(!s)continue;if(bs&&assign(s,'sup',bs))n++;if(bd)assign(s,'dept',bd);if(bh&&!assign(s,'shift',bh))skipped++}
      save();ui.sel.clear();render();toast(skipped?`${t('Saved')}. ${skipped} already had a shift: use Shift changes for them.`:t('Saved'));break}
    case 'shift-change':ui.scStaff=id;ui.tab='shift';render();break;
    case 'att-edit':if(pm)attEdit(id,el.dataset.d);break;
    case 'ci':case 'co':case 'abs':case 'undo':case 'undo-out':mark(id,a);break;
    case 'inc-new':incNew();break;
    case 'sum-pdf':sumPdf();break;case 'sum-xlsx':sumXlsx();break;
    case 'att-xlsx':xlsx(`ITU-FieldOps-Attendance-${ui.f.att.from||ui.day}.xlsx`,{Attendance:attExportRows(attRows())});break;
    case 'att-pdf':{const rows=attRows(),f=ui.f.att,from=f.from||ui.day,to=f.to||from;const doc=pdfStart('Attendance Report',(from===to?fmtEn(from):fmtEn(from)+' to '+fmtEn(to))+' · '+rows.length+' records');if(!doc)break;
      const cnt=k=>rows.filter(r=>r.st.k===k).length;pdfKpis(doc,[{v:rows.length,l:'Records',c:PDF.acc},{v:cnt('on_time'),l:'On time'},{v:cnt('late'),l:'Late'},{v:cnt('absent'),l:'Absent'},{v:cnt('not_in'),l:'Not checked in'},{v:cnt('scheduled'),l:'Scheduled'}]);
      const fl=[f.sup&&'Supervisor: '+supName(f.sup),f.dept&&'Department: '+f.dept,f.shift&&'Shift: '+shiftById(f.shift)?.name,f.status&&'Status: '+(STATUS_LABEL[f.status]||f.status),(f.tf||f.tt)&&`Check-in ${f.tf||'..'}-${f.tt||'..'}`,f.q&&'Search: '+f.q].filter(Boolean);
      if(fl.length){doc.setFontSize(8);doc.setTextColor(...PDF.mut);doc.text(pdfSafe('Filters: '+fl.join(' · ')),PDF.L,doc._y-3);doc._y+=4}
      pdfTable(doc,['Date','ID','Name','Supervisor','Dept','Shift','In','Out','Late','Status'],rows.map(({d,s,st})=>[d.slice(5),s.code,s.name,s.role==='Marshal'?supName(s.sup):'-',s.dept,st.sh?.name||'',st.r?.in||'',st.r?.out||'',st.late?'+'+st.late:'',STATUS_LABEL[st.k]]));
      pdfFinish(doc,`ITU-FieldOps-Attendance-${from}${to!==from?'_'+to:''}.pdf`);break}
    case 'staff-xlsx':xlsx('ITU-FieldOps-Staff.xlsx',{Staff:staffRows().map(s=>({'Employee ID':s.code,Name:s.name,Role:s.role,Supervisor:supName(s.sup),Department:s.dept,Shift:shLabel(shiftOf(s,ui.day)),Phone:s.phone,QID:s.qid||'',Nationality:s.nat||''}))});break;
    case 'staff-pdf':{const rows=staffRows(),doc=pdfStart('Staff & Assignments',`${rows.length} staff · as of ${fmtEn(ui.day)}`);if(!doc)break;
      pdfTable(doc,['ID','Name','Role','Supervisor','Department','Shift'],rows.map(s=>[s.code,s.name,s.role,supName(s.sup)||'-',s.dept||'-',shLabel(shiftOf(s,ui.day))||'-']));pdfFinish(doc,'ITU-FieldOps-Staff.pdf');break}
    case 'inc-xlsx':xlsx('ITU-FieldOps-Incidents.xlsx',{Incidents:incExportRows(incList())});break;
    case 'inc-pdf':{const l=incList(),doc=pdfStart('Incident Log',`${l.length} incidents`);if(!doc)break;pdfTable(doc,['Date','Time','Category','Severity','Department','Description','By'],l.map(i=>[i.date.slice(5),i.time,i.cat,i.sev,i.dept,i.desc,i.by]));pdfFinish(doc,'ITU-FieldOps-Incidents.pdf');break}
    case 'sc-xlsx':xlsx('ITU-FieldOps-Shift-Changes.xlsx',{'Shift changes':scExportRows()});break;
    case 'sc-pdf':{const l=shiftLog(),doc=pdfStart('Shift Change Audit Record',`${l.length} changes · each approved by ${APPROVER} by email`);if(!doc)break;pdfTable(doc,['Recorded','Staff','From','To','Effective','Email date','Reference','By'],l.map(a=>[tsFmt(a.ts),a.staffCode+' '+a.staffName,a.fromShift,a.toShift,a.effective,a.emailDate,a.emailRef,a.by]));pdfFinish(doc,'ITU-FieldOps-Shift-Changes.pdf');break}
    case 'audit-xlsx':xlsx('ITU-FieldOps-Audit-Log.xlsx',{'Audit log':auditList().map(a=>({Recorded:tsFmt(a.ts),Type:a.type,Detail:a.detail,By:a.by}))});break;
    case 'audit-pdf':{const l=auditList(),doc=pdfStart('Audit Log',`${l.length} entries`);if(!doc)break;pdfTable(doc,['Recorded','Type','Detail','By'],l.map(a=>[tsFmt(a.ts),a.type,a.detail,a.by]));pdfFinish(doc,'ITU-FieldOps-Audit-Log.pdf');break}
    case 'tpl':xlsx('ITU-FieldOps-Staff-Template.xlsx',{Staff:[{'Employee ID':'SUP-01','Full Name':'Example Supervisor','Role':'Supervisor','Phone':'+974 5000 0000'},{'Employee ID':'MAR-001','Full Name':'Example Marshal','Role':'Marshal','Phone':'+974 5000 0001'}]});break;
    case 'imp-cancel':ui.importPreview=null;render();break;
    case 'imp-go':confirmBox(ui.lang==='ar'?'سيتم استبدال قائمة الموظفين وحذف الحضور والحوادث الحالية. هل تريد المتابعة؟':'This replaces the staff list and clears current attendance and incidents. Continue?',()=>{const p=ui.importPreview,keep={departments:S.departments,shifts:S.shifts,settings:S.settings,audit:S.audit};
      S=freshState(p.rows.map(r=>({id:uid(),...r,sup:'',dept:'',shifts:[]})),'import');Object.assign(S,keep);ui.role='pm';Prefs.set('role','pm');
      log('Import',`${p.rows.length} staff imported from ${p.file} (all unassigned)`);ui.importPreview=null;save();render();toast(t('Saved'))});break;
    case 'demo':if(LIVE)break;confirmBox(ui.lang==='ar'?'سيتم استبدال التوزيع الحالي ببيانات وهمية. متابعة؟':'This replaces current assignments and attendance with fake demo data. Continue?',loadDemo);break;
    case 'reset-sample':if(LIVE)break;confirmBox(ui.lang==='ar'?'إعادة القائمة النموذجية: 68 موظفاً غير موزَّعين وبدون سجلات.':'Reset to the clean sample: 68 unassigned staff, no records.',()=>{S=freshState(sampleStaff(),'sample');ui.role='pm';Prefs.set('role','pm');save();render()});break;
    case 'signout':Cloud.auth.signOut().then(()=>location.reload());break;
    case 'acc-save':if(LIVE&&pm)setAccount(id);break;
    case 'acc-del':if(LIVE&&pm)confirmBox(ui.lang==='ar'?'سيتم إيقاف دخول هذا المشرف. متابعة؟':'This supervisor will no longer be able to sign in. Continue?',()=>delAccount(id));break;
    case 'auth-in':case 'auth-up':case 'auth-reset':authAction(a);break;
    case 'dept-add':{const v2=$('#new-dept').value.trim();if(v2&&!S.departments.includes(v2)){S.departments.push(v2);log('Settings','Department added: '+v2);save();render()}break}
    case 'dept-del':{if(S.staff.some(s=>s.dept===v)){toast('Staff are assigned to this department.');break}S.departments=S.departments.filter(d=>d!==v);log('Settings','Department removed: '+v);save();render();break}
    case 'shift-add':{const ids='ABCDEFGHIJ'.split('').filter(x=>!S.shifts.some(s=>s.id===x));if(!ids.length)break;S.shifts.push({id:ids[0],name:'New shift',start:'09:00',end:'17:00'});log('Settings','Shift added: '+ids[0]);save();render();break}
  }
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.actChange==='day'){ui.day=el.value;render();return}
  if(el.dataset.actChange==='role'){ui.role=el.value;Prefs.set('role',el.value);ui.tab='';render();return}
  if(el.dataset.assign&&ui.role==='pm'){const s=byId(el.dataset.id);if(assign(s,el.dataset.assign,el.value)){save();toast(t('Saved'));$('#res-staff').innerHTML=RES.staff()}return}
  if(el.id==='imp-file'&&el.files[0]){if(!window.XLSX){toast('Excel library failed to load.');return}readImport(el.files[0]);return}
  if(el.id==='set-grace'){const g=Math.max(0,Math.min(120,parseInt(el.value,10)||0));S.settings.grace=g;log('Settings','Grace period: '+g+' min');save();toast(t('Saved'));return}
  if(el.dataset.shift){const x=shiftById(el.dataset.shift);if(x&&el.value){x[el.dataset.k]=el.value;log('Settings',`Shift ${x.id} ${el.dataset.k}: ${el.value}`);save();toast(t('Saved'))}return}
  if(el.id==='sc-staff'){ui.scStaff=el.value;const s=byId(el.value);$('#sc-cur').value=s?shLabel(shiftOf(s,$('#sc-eff').value||ui.day)):'';return}
  if(el.dataset.f&&el.tagName==='SELECT'||el.dataset.f&&(el.type==='date'||el.type==='time'))filterInput(el);
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&(el.type==='search'||el.type==='text'))filterInput(el)});
document.addEventListener('submit',e=>{if(e.target.id==='sc-form')submitShift(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function filterInput(el){const [scope,key]=el.dataset.f.split('.');ui.f[scope][key]=el.value;const box=$('#res-'+scope);if(box)box.innerHTML=RES[scope]()}
/* ---------- Live sign-in ---------- */
function signInView(){return `<div class="wrap" style="padding-block:48px;display:flex;justify-content:center"><form class="panel" id="auth-form" style="width:min(400px,100%);display:flex;flex-direction:column;gap:12px;padding:22px">
  <div class="brand"><b>ITU FIELD OPS 2026</b><span>DECC · Doha · 9–27 Nov</span></div>
  <label class="small muted" style="display:flex;flex-direction:column;gap:4px">${t('Username')}<input type="text" autocomplete="username" autocapitalize="none" spellcheck="false" id="au-email" value="${esc(ui.authEmail||'')}"></label>
  <label class="small muted" style="display:flex;flex-direction:column;gap:4px">Password<input type="password" autocomplete="current-password" id="au-pass"></label>
  ${ui.authMsg?`<div class="small" style="color:var(--bad)">${esc(ui.authMsg)}</div>`:''}
  <button class="btn pri" type="submit">Sign in</button>
  <div class="small muted">${ui.lang==='ar'?'نسيت كلمة السر؟ اطلب من مدير المشروع كلمة جديدة.':'Forgot your password? Ask the Project Manager for a new one.'}</div>
  <button class="btn ghost sm" type="button" data-act="auth-up">Project Manager: first sign-in</button>
  <button class="btn ghost sm" type="button" data-act="lang">${ui.lang==='ar'?'English':'العربية'}</button></form></div>`}
async function authAction(kind){const raw=($('#au-email').value||'').trim().toLowerCase(),pw=$('#au-pass').value;let em=toEmail(raw);ui.authEmail=raw;ui.authMsg='';
  try{if(!raw||!pw)throw{message:'Enter your username and password.'};
    if(kind==='auth-up'){if(!PM_EMAILS.includes(em))throw{message:'Only the Project Manager creates a password here. Supervisors get theirs from the Project Manager.'};if(pw.length<8)throw{message:'Use at least 8 characters for the password.'};await Cloud.auth.createUserWithEmailAndPassword(em,pw);return}
    if(!raw.includes('@')&&!PM_EMAILS.includes(em)){const d=await Cloud.db.collection('logins').doc(raw).get();if(d.exists)em=d.data().email}
    Cloud.uname=raw;
    await Cloud.auth.signInWithEmailAndPassword(em,pw);
  }catch(e){const c=e.code||'';ui.authMsg=c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?'Username or password is wrong.':c.includes('email-already-in-use')?'This username already has a password. Sign in, or ask the Project Manager to reset it.':c.includes('invalid-email')?'Use letters, numbers, dots or dashes in the username.':c.includes('too-many-requests')?'Too many attempts. Wait a few minutes.':(e.message||'Sign-in failed.');render()}}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();authAction('auth-in')}});
async function bootLive(){
  firebase.initializeApp(FIREBASE_CONFIG);Cloud.auth=firebase.auth();Cloud.db=firebase.firestore();
  try{await Cloud.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  Cloud.auth.onAuthStateChanged(async u=>{Cloud.unsubs.forEach(f=>f());Cloud.unsubs=[];Cloud.loaded.clear();Cloud.synced={};Cloud.priv=new Map();Cloud.access=new Map();Cloud.initDone=false;S={...freshState([],'live'),audit:[]};
    if(!u){ui.role='';render();return}
    const em=(u.email||'').toLowerCase();Cloud.email=em;
    if(PM_EMAILS.includes(em))ui.role='pm';
    else{try{const d=await Cloud.db.collection('access').doc(em).get();ui.role=d.exists&&d.data().role==='supervisor'?d.data().staffId:''}catch(e){ui.role=''}
      if(!ui.role){ui.authMsg=ui.lang==='ar'?'هذا الحساب غير مفعّل. اطلب من مدير المشروع حساباً جديداً.':'This account is not active. Ask the Project Manager for a new one.';await Cloud.auth.signOut();return}}
    ui.authMsg='';render();Cloud.start()});
}
/* Live refresh: statuses like "Not checked in" change with the clock */
setInterval(()=>{if((!LIVE||ui.role)&&$('#modal').hidden&&!document.activeElement?.matches('input,select,textarea')&&['dash','team','rep'].includes(ui.tab))render()},60000);
if(LIVE)bootLive();
render();
</script>
