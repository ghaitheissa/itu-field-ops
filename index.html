.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.btn.bad{color:var(--bad);border-color:var(--bad)}

.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--demo);background:var(--demo-soft);border:1px solid transparent;border-radius:99px;padding:3px 9px;cursor:pointer}
.live-tag{display:inline-flex;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:3px 9px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px dashed var(--demo);background:var(--demo-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px}
.banner b{color:var(--demo)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{border-inline-end:2px dotted color-mix(in srgb,var(--muted) 55%,transparent);border-bottom:2px dotted color-mix(in srgb,var(--muted) 55%,transparent);margin-inline-end:-2px;margin-bottom:-2px;background:transparent!important;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)} .kpi.acc .v{color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end}
.filters label,.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.filters select,.filters input{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.form .full{grid-column:1/-1}
.form label > *{color:var(--fg);font-size:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px dotted var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td select{min-height:30px;padding:3px 6px;font-size:13px;max-width:170px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-on_time,.c-present{color:var(--ok);background:var(--ok-soft)}
.c-late{color:var(--warn);background:var(--warn-soft)}
.c-absent,.c-not_in,.c-High{color:var(--bad);background:var(--bad-soft)}
.c-scheduled,.c-unassigned,.c-Low{color:var(--idle);background:var(--idle-soft)}
.c-Medium{color:var(--warn);background:var(--warn-soft)}
.c-out{color:var(--muted);background:var(--sunk)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .nm{font-weight:600}
.card .acts{display:flex;flex-wrap:wrap;gap:6px}
.sep{border:0;border-top:1px dotted var(--muted);opacity:.5;margin:4px 0}
.bulk{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;background:var(--fg);color:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.bulk select{background:var(--bg);color:var(--fg);border-color:transparent}
.bulk .btn:not(.pri){background:transparent;color:var(--bg);border-color:var(--bg)}
#modal{position:fixed;inset:0;z-index:20;background:rgb(10 6 8 / .45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(620px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;z-index:30;inset-inline-start:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;max-width:calc(100% - 32px)}
html[dir="rtl"] #toast{transform:translateX(50%)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.legend ul{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.auth-side{background:var(--ink);color:var(--ink-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.auth-side .tri{position:absolute;inset-inline-end:-14%;top:50%;transform:translateY(-50%);width:62%;aspect-ratio:1/2;max-width:100%;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);opacity:.95}
.auth-side h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,7vw,88px);line-height:.92;letter-spacing:-.03em;position:relative;margin:0}
.auth-side h1 em{font-style:normal;color:var(--accent)}
.auth-side .meta{position:relative;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.auth-form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.auth-form img{height:48px;width:auto;align-self:flex-start}
.auth-form h2{font-size:28px;font-weight:900}
.auth-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.auth-form input{min-height:48px!important;font-size:16px;border-width:1.5px!important;text-transform:none;letter-spacing:0}
.auth-form input:focus{border-color:var(--fg)!important;outline:none}
.pw{position:relative;display:flex}
.pw input{flex:1;padding-inline-end:48px}
.pw button{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:40px;height:40px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.auth-form .go{min-height:50px;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;justify-content:center}
@media (max-width:760px){.auth{grid-template-columns:1fr}.auth-side{padding-block:32px;min-height:220px}.auth-side .tri{width:40%}.auth-side h1{font-size:44px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,border-color .15s}}
@media (max-width:560px){.ctrls{order:3;width:100%;gap:6px 8px}.bar{gap:8px;padding-block:8px}.ctrls label{font-size:11px}.ctrls select{height:34px;padding-block:0}.brand{flex:1 1 0;gap:8px}.brand .bt{padding-inline-start:8px;min-width:0}.brand .bt span{display:none}.langpick{height:34px;padding:0 20px 0 8px}.burger{width:34px;height:34px}nav.tabs button{padding-block:8px} .brand img{height:22px} .brand b{font-size:13px} .kpi .v{font-size:28px} h2{font-size:21px}}

/* modern look */
:root{--r:14px}
.btn{border-radius:12px;min-height:40px;padding:8px 16px;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
.btn:active,.dl:active,.inst:active,.burger:active,.kpi:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#ffffff),var(--accent));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.sm{border-radius:10px;min-height:32px;padding:4px 12px}
.btn.ghost{color:var(--accent)}
.dl{width:46px;height:46px;border-radius:14px;transition:transform .12s,border-color .15s}.dl.sm{border-radius:11px}
.burger,.inst{border-radius:12px;height:40px}.burger{width:40px}
select,input[type=text],input[type=date],input[type=time],input[type=search],input[type=email],textarea{border-radius:11px;min-height:40px;padding:8px 12px}
.kpis{gap:0;border-radius:18px}
.kpi{padding:16px 16px 14px;gap:6px;position:relative}
.kpi .l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.kpi .kd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.kpi.acc .kd{background:var(--accent)}.kpi.ok .kd{background:var(--ok)}.kpi.warn .kd{background:var(--warn)}.kpi.bad .kd{background:var(--bad)}.kpi.inc .kd{background:var(--idle)}
.kpi .v{font-size:34px}
.kpi .kb{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}.kpi .kb i{display:block;height:100%;border-radius:2px;background:var(--muted)}
.kpi.acc .kb i{background:var(--accent)}.kpi.ok .kb i{background:var(--ok)}.kpi.warn .kb i{background:var(--warn)}.kpi.bad .kb i{background:var(--bad)}
.kpi .vr{display:flex;align-items:baseline;gap:8px}.kpi .kp{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
nav.tabs button{border-radius:10px 10px 0 0}

/* install (from Masbahty) */
.tap-hand { flex: none; width: 38px; height: 38px; color: var(--accent); overflow: visible; }
.tap-hand path { transform-origin: 13px 9px; animation: tap-press 1.6s cubic-bezier(.4,0,.2,1) infinite; }
.tap-hand__ring { fill: none; stroke: var(--accent); stroke-width: 1.4; transform-origin: 13px 7px; animation: tap-ring 1.6s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes tap-press { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(2px) scale(.93); } 45% { transform: translateY(0) scale(1); } }
@keyframes tap-ring { 0%, 25% { opacity: 0; transform: scale(.3); } 35% { opacity: 1; } 80%, 100% { opacity: 0; transform: scale(1.5); } }
.inst-modal { position: fixed; inset: 0; z-index: 72; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .3s; }
.inst-modal.is-open { opacity: 1; }
.inst-modal__card { width: min(360px, 100%); padding: 20px 18px 18px; border-radius: 26px; background: linear-gradient(180deg, var(--surface), var(--surface));
  border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
.inst-modal__card h3 { margin: 0 0 14px; text-align: center; font-size: 17px; font-weight: 600; }
.inst-steps { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.inst-steps li { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.inst-steps__n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 14px; }
.inst-steps__t { flex: 1; font-size: 14.5px; line-height: 1.55; }
.step-ic { flex: none; width: 24px; height: 24px; color: var(--accent); }
.inst-prog { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px; }
.inst-prog__ring { width: 96px; height: 96px; }
.inst-prog__ring circle { fill: none; stroke-width: 5; }
.inst-prog__ring .bg { stroke: var(--sunk); }
.inst-prog__ring .fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 60 201; transform-origin: 40px 40px; animation: spin 1s linear infinite; transition: stroke-dasharray .5s; }
.inst-prog__check { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; transition: stroke-dashoffset .5s .35s cubic-bezier(.2,.8,.2,1); }
.done .inst-prog__ring .fg { animation: none; stroke-dasharray: 201 0; }
.done .inst-prog__check { stroke-dashoffset: 0; }
.inst-prog__t { margin: 0; font-size: 15.5px; text-align: center; }
/* animated install guide */
.ig { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 12px; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .3s; }
.ig.is-open { opacity: 1; }
.ig__card { position: relative; width: min(420px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 16px 16px; border-radius: 24px; background: linear-gradient(180deg, var(--surface), var(--surface)); border: 1px solid var(--line); box-shadow: 0 24px 60px -20px #000; }
.ig__card h3 { text-align: center; font-size: 18px; margin: 4px 40px 12px; }
.ig__x { position: absolute; top: 12px; inset-inline-end: 12px; }
.ig__ask { text-align: center; color: var(--muted); margin-bottom: 14px; }
.ig__oses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ig__os { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 10px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.ig__os svg { width: 44px; height: 44px; color: var(--accent); }
.ig__os b { font-size: 18px; color: var(--fg); }
.ig__os small { color: var(--muted); font-size: 12.5px; }
.ig__os.is-me { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ig__sharebtn { width: 100%; margin-top: 14px; gap: 8px; }
.ig__sharebtn svg, .ig__endrow svg { width: 18px; height: 18px; }
.ig__phonewrap { display: flex; justify-content: center; }
.ig__phone { width: 266px; height: 536px; padding: 8px; border-radius: 38px; background: #0d0d0d; box-shadow: 0 0 0 2px #2a2a2a, 0 16px 36px -14px #000; transform: scale(var(--k)); transform-origin: top center; flex: none; }
.ig__screen { position: relative; width: 250px; height: 520px; border-radius: 30px; overflow: hidden; background: #ffffff; }
.ig__world { position: absolute; left: 0; top: 0; width: 250px; height: 520px; transform-origin: 0 0; transition: transform .85s cubic-bezier(.45, 0, .2, 1); }
.igs { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .35s, transform .35s, visibility .35s; }
.igs.is-on { opacity: 1; visibility: visible; }
.ig-shot { position: absolute; left: 0; width: 250px; }
.ig-cbar { position: absolute; top: 0; left: 0; right: 0; height: 40px; direction: ltr; display: flex; flex-direction: row-reverse; align-items: center; gap: 6px; padding: 0 6px; background: #202124; color: #e8eaed; font: 13px Roboto, system-ui, sans-serif; z-index: 2; }
.ig-cbar.rtl { flex-direction: row; }
.ig-url { flex: 1; height: 28px; border-radius: 14px; background: #3c4043; font-size: 10px; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; direction: ltr; }
.ig-dots { width: 26px; height: 26px; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
.igs--menu { inset: auto; top: 42px; right: 6px; width: 172px; padding: 4px 0; background: #2d2e31; border-radius: 8px; box-shadow: 0 8px 22px #000; font: 12px Roboto, 'Noto Sans Arabic', system-ui, sans-serif; color: #e8eaed; transform: scale(.9); transform-origin: top right; }
.igs--menu.rtl { right: auto; left: 6px; transform-origin: top left; }
.igs--menu.is-on, .igs--dlg.is-on, .igs--sheet.is-on { transform: none; }
.ig-mi { height: 30px; display: flex; align-items: center; padding: 0 12px; }
.igs--dlg { inset: auto; left: 14px; right: 14px; top: 170px; padding: 16px; border-radius: 20px; background: #2d2e31; color: #e8eaed; font: 13px Roboto, 'Noto Sans Arabic', system-ui, sans-serif; box-shadow: 0 10px 30px #000; transform: scale(.9); }
.igs--dlg b { font-size: 16px; font-weight: 500; }
.ig-app, .ig-shead, .ig-acard { display: flex; align-items: center; gap: 10px; margin: 14px 0 16px; }
.ig-app img, .ig-shead img, .ig-acard img { width: 38px; height: 38px; border-radius: 9px; }
.ig-app small, .ig-shead small, .ig-acard small { display: block; font-size: 9.5px; color: #9aa0a6; }
.ig-btns { display: flex; justify-content: flex-end; gap: 4px; color: #8ab4f8; font-weight: 500; }

.ig-sbar { position: absolute; bottom: 0; left: 0; right: 0; height: 76px; padding: 7px 10px 0; background: rgba(246,246,248,.97); font-family: -apple-system, system-ui, sans-serif; }
.ig-surl { height: 30px; border-radius: 9px; background: #e3e3e8; color: #111; font-size: 10.5px; display: flex; align-items: center; justify-content: center; }
.ig-sicons { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; color: #0a84ff; font-size: 18px; padding: 0 4px; }
.ig-sicons span { width: 30px; height: 28px; display: grid; place-items: center; }
.ig-sicons svg { width: 21px; height: 21px; }
.igs--sheet { inset: auto 0 0 0; padding: 12px 10px 14px; border-radius: 14px 14px 0 0; background: #f2f2f7; color: #000; font: 12px -apple-system, 'Noto Sans Arabic', system-ui, sans-serif; box-shadow: 0 -10px 30px rgba(0,0,0,.5); transform: translateY(40%); }
.ig-shead { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid #d1d1d6; }
.ig-row { display: flex; justify-content: space-between; align-items: center; height: 34px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e5e5ea; }
.ig-row svg { width: 18px; height: 18px; }
.igs--add { background: #f2f2f7; color: #000; font: 12px -apple-system, 'Noto Sans Arabic', system-ui, sans-serif; }
.ig-anav { display: flex; justify-content: space-between; align-items: center; padding: 34px 12px 10px; color: #0a84ff; }
.ig-anav b { color: #000; font-size: 11.5px; }
.ig-anav .ig-go { font-weight: 700; padding: 2px 4px; }
.ig-acard { margin: 8px 10px; padding: 10px; background: #fff; border-radius: 10px; }
.ig-aname { font-size: 13px; padding-bottom: 6px; border-bottom: 1px solid #e5e5ea; margin-bottom: 4px; }
.igs--home { display: grid; grid-template-columns: repeat(4, 1fr); align-content: start; gap: 18px 10px; padding: 56px 16px 0; background: radial-gradient(circle at 30% 20%, #3b5ea8, #1b2448 55%, #0e1226); }
.igh__app { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.igh__app i { width: 44px; height: 44px; border-radius: 12px; opacity: .85; }
.igh__app b { width: 30px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.45); }
.igh__me { opacity: 0; transform: translateY(-160px) scale(.6); }
.igh__me.is-in { opacity: 1; transform: none; transition: transform .8s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; }
.igh__me img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.igh__me span { font-size: 9.5px; color: #fff; font-family: 'Noto Sans Arabic', system-ui, sans-serif; }
.ig__ring { position: absolute; z-index: 5; border: 3px solid #e3171d; box-shadow: 0 0 0 3px rgba(227,23,29,.3), 0 0 18px rgba(227,23,29,.6); opacity: 0; pointer-events: none; }
.ig__ring.is-on { animation: ig-ring 1.6s ease-out forwards; }
.ig__ring[style*='7px'] { border-width: 2px; box-shadow: 0 0 0 2px rgba(227,23,29,.25), 0 0 10px rgba(227,23,29,.5); }
@keyframes ig-ring { 0% { opacity: 0; transform: scale(1.8); } 25% { opacity: 1; transform: scale(1); } 45% { transform: scale(.88); } 60%, 100% { opacity: 1; transform: scale(1); } }
.ig__dots { display: flex; justify-content: center; gap: 6px; margin: 12px 0 6px; }
.ig__dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
.ig__dots i.is-on { background: var(--accent); }
.ig__cap { min-height: 48px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--fg); }
.ig__end { margin-top: 8px; }
.ig__installbtn { width: 100%; font-size: 16px; padding: 14px; margin-bottom: 8px; animation: qb-pulse 1.8s cubic-bezier(.4,0,.2,1) infinite; }
.ig__endrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.ig__endrow .btn { padding: 10px 8px; font-size: 13.5px; }
.install-banner .ib { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 14px; text-align: start; background: var(--surface); border: 1px solid var(--line); }
.install-banner .ib span { display: flex; flex-direction: column; min-width: 0; }
.install-banner .ib b { font-size: 13.5px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.install-banner .ib small { font-size: 10.5px; line-height: 1.3; color: var(--muted); }
.ib__ic { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.ib__ic svg { width: 18px; height: 18px; }
.ib--video .ib__ic { background: linear-gradient(180deg, var(--accent), var(--accent)); color: #ffffff; box-shadow: 0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent); animation: qb-pulse 1.8s cubic-bezier(.4,0,.2,1) infinite; }
.ib--go .ib__ic { border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }
.ig__endrow.no-share { grid-template-columns: 1fr 1fr; }
.install-banner .ib--one { justify-content: center; }
.install-banner .ib--one span { flex: none; }
.igs--share { inset: auto 0 0 0; padding: 12px 10px 18px; border-radius: 18px 18px 0 0; background: #f2f2f7; color: #000; font: 12px -apple-system, 'Noto Sans Arabic', system-ui, sans-serif;
  box-shadow: 0 -10px 30px rgba(0,0,0,.5); transform: translateY(40%); }
.igs--share.is-on { transform: none; }
.igs--share .ig-shead { position: relative; }
.ig-opt { margin-inline-start: auto; font-size: 10px; color: #0a84ff; white-space: nowrap; }
.ig-people { display: flex; justify-content: space-between; padding: 4px 6px 12px; border-bottom: 1px solid #d1d1d6; }
.ig-pp { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ig-pp i { width: 40px; height: 40px; border-radius: 50%; }
.ig-pp b { width: 30px; height: 4px; border-radius: 2px; background: #c7c7cc; }
.ig-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-top: 12px; }
.ig-act { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.ig-act i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.ig-act i svg { width: 22px; height: 22px; }
.ig-act span { font-size: 9.5px; color: #3a3a3c; line-height: 1.25; }
.ig-act[data-t="more"] i { background: #e5e5ea; }
.install-banner{display:flex;gap:8px;margin:0 0 14px}.auth-main .install-banner{max-width:420px;margin:0 auto 18px;width:100%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes qb-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.ig__x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}.ig__x svg{width:18px;height:18px}
.ig__os,.install-banner .ib{cursor:pointer;font:inherit;color:inherit}
.ig__card h3,.inst-modal__card h3{text-transform:none;letter-spacing:0;color:var(--fg);font-size:18px;font-weight:700}.ig__end .btn{justify-content:center}
.rangebtn{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;font:inherit;color:var(--muted);width:100%;text-align:start}.rangebtn svg{width:18px;height:18px;flex:none;color:var(--accent)}.rangebtn.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.rc-m{text-align:center;font-weight:700;font-family:var(--f-display)}
.rc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.rc b{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.rc-d{height:40px;border-radius:10px;border:0;background:var(--sunk);font:inherit;font-weight:600;color:var(--fg);cursor:pointer;display:grid;place-items:center}.rc-d.off{background:none;color:var(--muted);opacity:.35;cursor:default;font-weight:400}
.rc-d.in{background:var(--accent-soft);color:var(--accent)}.rc-d.end{background:var(--accent);color:#ffffff}
.rc-msg{text-align:center;font-weight:600;min-height:22px}
.btn.danger{color:var(--bad);border-color:currentColor}
.sub{font-size:11px;color:var(--muted);line-height:1.2;margin-top:1px}
table.pick tbody tr:not(.grp){cursor:pointer}table.pick tbody tr.sel td{background:var(--accent-soft)}table.pick tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.grp td{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.02em;position:sticky;top:0}
tr.go{cursor:pointer}tr.go:hover td{background:var(--sunk)}.lnk{text-decoration:underline dotted;text-underline-offset:3px}.nowrap{white-space:nowrap}
.dot-pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:dp 1.2s infinite}@keyframes dp{50%{opacity:.25;transform:scale(.7)}}

  PDF.W=doc.internal.pageSize.getWidth();PDF.H=doc.internal.pageSize.getHeight();PDF.R=PDF.W-18;
  try{doc.addImage(pdfLogo(),'JPEG',PDF.L,13,36,36*140/640)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...PDF.acc);doc.setCharSpace(0.8);doc.text('ITU FIELD OPS 2026',PDF.R,19,{align:'right'});doc.setCharSpace(0);
  doc.setFont('helvetica','normal');doc.setFontSize(19);doc.setTextColor(...PDF.ink);doc.text(pdfSafe(title),PDF.L,31);
  doc.setFontSize(9);doc.setTextColor(...PDF.mut);doc.text(pdfSafe(sub),PDF.L,38);

}
function pdfSection(doc,label){if(doc._y>PDF.H-35){doc.addPage();doc._y=22}doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...PDF.mut);doc.setCharSpace(0.6);doc.text(pdfSafe(label.toUpperCase()),PDF.L,doc._y);doc.setCharSpace(0);doc._y+=4}
function pdfKpis(doc,items){
  const w=(PDF.R-PDF.L)/Math.min(items.length,6);items.forEach((it,i)=>{const row=Math.floor(i/6),x=PDF.L+(i%6)*w,y=doc._y+row*17;
    doc.setFont('helvetica','normal');doc.setFontSize(18);doc.setTextColor(...(it.c||PDF.ink));doc.text(String(it.v),x,y+7);
    doc.setFontSize(7.5);doc.setTextColor(...PDF.mut);doc.text(pdfSafe(it.l),x,y+12)});
  doc._y+=Math.ceil(items.length/6)*17+2;pdfDot(doc,doc._y);doc._y+=9;
}
function pdfTable(doc,head,body){
  if(!body.length){doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(...PDF.mut);doc.text('None',PDF.L,doc._y+4);doc._y+=14;return}
  doc.autoTable({startY:doc._y,head:[head.map(pdfSafe)],body:body.map(r=>r.map(pdfSafe)),theme:'plain',margin:{left:PDF.L,right:PDF.W-PDF.R,top:20,bottom:22},
    styles:{font:'helvetica',fontSize:8.5,textColor:PDF.ink,cellPadding:{top:2.4,bottom:2.4,left:1.2,right:2}},
    headStyles:{fontStyle:'bold',fontSize:7,textColor:PDF.mut},
    didDrawCell:d=>{if(d.column.index===0){const y=d.cell.y+d.cell.height;d.doc.setLineDashPattern([0.25,1.1],0);d.doc.setDrawColor(...(d.section==='head'?PDF.mut:PDF.dot));d.doc.setLineWidth(d.section==='head'?0.35:0.25);d.doc.line(PDF.L,y,PDF.R,y);d.doc.setLineDashPattern([],0)}}});
  doc._y=doc.lastAutoTable.finalY+11;
}
function pdfFinish(doc,filename,noSave){
  const n=doc.getNumberOfPages(),stamp='Generated '+tsFmt(new Date().toISOString())+' (Doha) by '+actor();
  for(let i=1;i<=n;i++){doc.setPage(i);pdfDot(doc,PDF.H-15);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...PDF.mut);
    doc.text(pdfSafe('DECC, Doha · 9-27 November 2026 · '+stamp+(S.source==='sample'||S.demoScenario?' · DEMO DATA':'')),PDF.L,PDF.H-10);doc.text(`${i} / ${n}`,PDF.R,PDF.H-10,{align:'right'})}
  const blob=doc.output('blob');if(!noSave)saveFile(filename,blob);return blob;
}

/* ---------- Scope filter (Dashboard + Reports) ---------- */
function SC(){const f=ui.tab==='dash'&&ui.role==='pm'&&!can('dashFilter')?{}:ui.f.scope,from=f.from||ui.day,to=f.to&&f.to>=from?f.to:from;return{...f,from,to,days:DAYS.filter(d=>d>=from&&d<=to),person:ui.tab==='rep'?ui.repPerson||'':''}}
const inScope=(s,sc)=>(!sc.person||s.id===sc.person)&&(!sc.dept||inDept(s,sc.dept))&&(!sc.sup||s.sup===sc.sup||s.id===sc.sup);
function scopeRows(list,sc){const out=[];for(const d of sc.days)for(const s of list){if(!inScope(s,sc))continue;const st=statusOf(s,d);if(st.k==='unassigned')continue;if(sc.shift&&st.sh?.id!==sc.shift)continue;if(sc.status&&!stMatch(st,sc.status))continue;out.push({d,s,st})}return out}
const stMatch=(st,k)=>k==='onduty'?!!(st.r&&st.r.in):k==='out'?!!(st.r&&st.r.out):k==='issue'?['late','absent','not_in'].includes(st.k):st.k===k;
const ST_OPTS=[['issue','Late, absent or not in'],['late','Late'],['absent','Absent'],['not_in','Not checked in'],['on_time','On time'],['onduty','On duty now'],['out','Checked out'],['scheduled','Scheduled']];
function statsOf(rows){const c={total:0,on_time:0,late:0,absent:0,not_in:0,scheduled:0,onduty:0,out:0};for(const{st}of rows){c.total++;c[st.k]++;if(st.r&&st.r.in)c.onduty++;if(st.r&&st.r.out)c.out++}return c}
const scopeIncidents=sc=>S.incidents.filter(i=>i.date>=sc.from&&i.date<=sc.to&&(!sc.dept||i.dept===sc.dept)&&(!sc.sup||i.byId===sc.sup||byId(i.staff)?.sup===sc.sup)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const scopeActive=sc=>!!(sc.dept||sc.sup||sc.shift||sc.status||sc.person);
const scopeLabel=sc=>sc.from===sc.to?`${t('Day')} ${dayNo(sc.from)}, ${fmtD(sc.from)}`:`${fmtD(sc.from)} – ${fmtD(sc.to)} (${sc.days.length} ${ui.lang==='ar'?'أيام':'days'})`;
const scopeLabelEn=sc=>sc.from===sc.to?`Day ${dayNo(sc.from)} · ${fmtEn(sc.from)}`:`${fmtEn(sc.from)} to ${fmtEn(sc.to)} (${sc.days.length} days)`;
const scopeFiltersEn=sc=>[sc.dept&&'Department: '+sc.dept,sc.shift&&'Shift: '+(shiftById(sc.shift)?.name||sc.shift),sc.sup&&'Supervisor: '+supName(sc.sup),sc.status&&'Status: '+(ST_OPTS.find(x=>x[0]===sc.status)||[,sc.status])[1]].filter(Boolean).join(' · ');
function scopeBar(){const sc=SC(),f=ui.f.scope;return `<div class="panel filters">
  <label>${t('Day')}<select data-act-change="scope-day">${sc.from!==sc.to?opt('',t('Custom range'),''):''}${DAYS.map(d=>opt(d,`${t('Day')} ${dayNo(d)} · ${fmtD(d)}`,sc.from===sc.to?sc.from:'')).join('')}</select></label>
  <label>${t('Custom range')}<button type="button" class="rangebtn${sc.from!==sc.to?' on':''}" data-act="range-open">${ICON.cal}<span>${sc.from!==sc.to?esc(fmtShort(sc.from)+' – '+fmtShort(sc.to)):(ui.lang==='ar'?'اختر من … إلى':'Pick from … to')}</span></button></label>
  ${fSel('scope','dept','Department',deptOptions(f.dept,t('All')))}${fSel('scope','shift','Shift',shiftOptions(f.shift,t('All')))}${fSel('scope','sup','Supervisor',supOptions(f.sup,t('All')))}${fSel('scope','status','Status',opt('',t('All'),f.status)+ST_OPTS.map(([k,l])=>opt(k,t(l),f.status)).join(''))}

/* ---------- Dashboard ---------- */
function dayStats(date,list){return statsOf(scopeRows(list,{days:[date]}))}
/* Overtime (extra hours) the owner adds per person per day, kept on the staff record as s.ot=[{id,d,mins,note,by,at}] */
const otOn=(s,d)=>(s.ot||[]).filter(o=>o.d===d).reduce((n,o)=>n+(+o.mins||0),0);
const otIn=(s,from,to)=>(s.ot||[]).filter(o=>o.d>=from&&o.d<=to&&active(s,o.d)).reduce((n,o)=>n+(+o.mins||0),0);
/* Hours and money tiles (owner and Payments permission): finished shifts, plus what is building up for people still on duty */
function payScope(sc){const today=doha().date,now=toMin(doha().time);let mins=0,pay=0,lm=0,lp=0,open=0;
  for(const{d,s,st}of scopeRows(S.staff,sc)){const o=otOn(s,d);if(o){mins+=o;pay+=payOf(s,o,d)}const r=st.r;if(!r)continue;const m=minsWorked(r);
    if(m){mins+=m;pay+=payOf(s,m,d)}else if(r.in&&!r.out&&!r.absent&&d===today){let x=now-toMin(r.in);if(x<0)x+=1440;open++;lm+=x;lp+=payOf(s,x,d)}}
  return {mins,pay:Math.round(pay*100)/100,lm,lp:Math.round(lp*100)/100,open}}
function payTiles(sc){if(!sc||!(can('payments')||isOwner()))return'';const ar=ui.lang==='ar';
  if(!hasRate())return `<button class="kpi pay" data-act="tab" data-v="data"><span class="l"><i class="kd"></i>${t('Payments')}</span><span class="v">—</span><span class="ksub">${ar?'حط سعر الساعة بالإعدادات':'Set the hourly rate in Settings'}</span></button>`;

  return `<button class="kpi pay" data-act="pay-go"><span class="l"><i class="kd"></i>${t('Hours worked')}</span><span class="v">${hm(P.mins)||'0:00'}</span>${P.open?`<span class="ksub">+${hm(P.lm)} ${ar?'لسا على الدوام':'still on duty'}</span>`:`<span class="ksub">${ar?'دوام مكتمل':'finished shifts'}</span>`}</button>
  <button class="kpi pay money" data-act="pay-go"><span class="l"><i class="kd"></i>${t('Payments due')}</span><span class="v">${money(P.pay)}<small> QAR</small></span>${P.open?`<span class="ksub">+${money(P.lp)} ${ar?'لهلأ (يلي لسا داخلين)':'so far (still on duty)'}</span>`:`<span class="ksub">${ar?'دوام مكتمل':'finished shifts'}</span>`}</button>`}
function kpiTiles(c,inc,sc){const k=(key,cls,v,l)=>`<button class="kpi ${cls}" data-act="kpi" data-v="${key}"><span class="l"><i class="kd"></i>${t(l)}</span>${key==='onduty'?`<span class="ksub">(${t('Checked in')})</span>`:''}${key==='total'?`<span class="v">${v}</span><span class="kb"><i style="width:100%"></i></span>`:`<span class="vr"><span class="v">${v}</span><span class="kp">${c.total?Math.round(v*100/c.total):0}%</span></span><span class="kb"><i style="width:${c.total?Math.round(v*100/c.total):0}%"></i></span>`}</button>`;
  return `<div class="kpis">${k('total','acc',c.total,'Assigned')}${k('onduty','',c.onduty,'On duty')}${k('on_time','ok',c.on_time,'On time')}${k('late','warn',c.late,'Late')}${k('absent','bad',c.absent,'Absent')}${k('not_in','bad',c.not_in,'Not checked in')}${k('out','',c.out,'Checked out')}
  ${inc!=null?`<button class="kpi inc" data-act="tab" data-v="inc"><span class="l"><i class="kd"></i>${t('Incidents')}</span><span class="v">${inc}</span><span class="kb"><i style="width:0"></i></span></button>`:''}${payTiles(sc)}</div>`}
function breakdown(groups,kind){
  return `<div class="tbl-wrap"><table><thead><tr><th></th><th class="num">${t('Team')}</th><th class="num">${t('On time')}</th><th class="num">${t('Late')}</th><th class="num">${t('Absent')}</th><th class="num">${t('Not checked in')}</th></tr></thead><tbody>
  ${groups.map(([label,rows,key])=>{const c=statsOf(rows);return `<tr class="go" data-act="grp" data-v="${esc(kind+'|'+(key||''))}"><td><span class="lnk">${esc(label)}</span> <span class="muted">›</span>${kind==='sup'&&key?supCall(key):''}</td><td class="num">${c.total}</td><td class="num">${c.on_time}</td><td class="num">${c.late}</td><td class="num">${c.absent}</td><td class="num">${c.not_in}</td></tr>`}).join('')}

}
function groupsBySup(rows,sc){const days=sc&&sc.days&&sc.days.length?sc.days:[ui.day];const g=[...sups().filter(s=>days.some(d=>active(s,d))||rows.some(r=>r.s.sup===s.id)).map(s=>[s.name,rows.filter(r=>r.s.sup===s.id),s.id]),[t('Unassigned'),rows.filter(r=>r.s.role==='Marshal'&&!r.s.sup),'']];return scopeActive(sc)?g.filter(x=>x[1].length):g}
function groupsByDept(rows,sc){const g=[...S.departments.map(d=>[d,rows.filter(r=>inDept(r.s,d)),d]),[t('Unassigned'),rows.filter(r=>!r.s.dept),'']];return scopeActive(sc)?g.filter(x=>x[1].length):g}
const VIEWS={};
/* Payments due: hours worked (check-in to check-out) x hourly rate, live from attendance */
function payData(){const today=doha().date,mode=ui.payMode||'all',sc=SC(),from=mode==='day'?(ui.role==='pm'&&can('dashFilter')?sc.from:ui.day):EVENT_START,to=mode==='day'?(ui.role==='pm'&&can('dashFilter')?sc.to:ui.day):(today>EVENT_END?EVENT_END:today);
  const m=new Map();let open=0;
  for(const[k,r]of Object.entries(S.att)){const[d,id]=k.split('|');if(d<from||d>to)continue;const s=byId(id);if(!s||!active(s,d))continue;const mins=minsWorked(r);if(r.in&&!r.out&&!r.absent){open++;continue}if(!mins)continue;
    let p=m.get(id);if(!p)m.set(id,p={s,days:0,mins:0,pay:0,ot:0});p.days++;p.mins+=mins;p.pay+=payOf(s,mins,d)}
  for(const s of S.staff){const o=otIn(s,from,to);if(!o)continue;let p=m.get(s.id);if(!p)m.set(s.id,p={s,days:0,mins:0,pay:0,ot:0});p.ot+=o;p.mins+=o;p.pay+=(s.ot||[]).filter(x=>x.d>=from&&x.d<=to&&active(s,x.d)).reduce((n,x)=>n+payOf(s,+x.mins,x.d),0)}
  const list=[...m.values()].map(p=>({...p,pay:Math.round(p.pay*100)/100})).sort((a,b)=>b.pay-a.pay||a.s.name.localeCompare(b.s.name));
  return {from,to,list,open,total:list.reduce((n,p)=>n+p.pay,0),mins:list.reduce((n,p)=>n+p.mins,0)}}
function payPanel(){if(!(can('payments')||isOwner()))return'';const ar=ui.lang==='ar';

   <div class="small muted">${esc(P.from===P.to?fmtEn(P.from):fmtEn(P.from)+' – '+fmtEn(P.to))} · ${ar?'الساعات من الدخول للخروج × سعر الساعة':'Hours from check-in to check-out × hourly rate'} (${money(+S.settings.rateM||0)}${S.settings.rateS&&+S.settings.rateS!==+S.settings.rateM?' / '+money(+S.settings.rateS)+' sup.':''} QAR/h)</div>
   ${P.list.length?`<div class="tbl-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>${t('ID')}</th><th>${t('Name')}</th><th>${t('Supervisor')}</th><th class="num">${t('Days')}</th><th class="num">${t('Hours')}</th><th class="num">QAR</th></tr></thead><tbody>${P.list.map(p=>`<tr><td class="mono">${esc(p.s.code)}</td><td>${esc(p.s.name)}</td><td class="small">${esc(p.s.role==='Marshal'?supName(p.s.sup)||'—':t('Supervisor'))}</td><td class="num mono">${p.days}</td><td class="num mono">${hm(p.mins)}${p.ot?`<div class="small muted">+${hm(p.ot)} OT</div>`:''}</td><td class="num mono"><b>${money(p.pay)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ar?'لسا ما في دوام مكتمل (دخول وخروج).':'No completed shifts yet (check-in and check-out).'}</div>`}

const whatTxt=(w,ar)=>ar?{in:'الدخول',out:'الخروج',both:'الدخول والخروج'}[w]:{in:'check-in',out:'check-out',both:'check-in and check-out'}[w];
function ckBulkDel(what){if(!isOwner())return;const ar=ui.lang==='ar',keys=[...ui.ckSel].filter(k=>S.att[k]);if(!keys.length){toast(ar?'ما في تسجيل للمحددين.':'Nothing recorded for the selected people.');return}
  confirmBox(ar?`مسح ${whatTxt(what,ar)} لـ ${keys.length} شخص؟`:`Remove ${whatTxt(what,ar)} for ${keys.length} people?`,()=>{let n=0;for(const v of keys)if(ckClear(v,what))n++;
    log('Undo',`${whatTxt(what)} removed by the owner for ${n} people: ${keys.map(k=>byId(k.split('|')[1])?.code).join(', ')}`);ui.ckSel.clear();save();render();toast(t('Saved'))},ar?'مسح':'Remove')}

function ckEdit(v){if(!isOwner())return;const [d,id]=v.split('|'),x=byId(id),r=S.att[v]||{},ar=ui.lang==='ar',sh=shiftOf(x,d);if(!x)return;
  modal(`<h2>✎ ${esc(x.name)}</h2><div class="small muted">${esc(fmtD(d))}${sh?` · ${esc(sh.name)} ${sh.start}–${sh.end}`:''}</div>
   <div class="form"><label>${t('Check in')}<input type="time" id="ce-in" value="${esc(r.in||'')}"></label><label>${t('Check out')}<input type="time" id="ce-out" value="${esc(r.out||'')}"></label></div>
   <div class="small muted">${ar?'فضّي الخانة لتمسحها.':'Clear a box to remove it.'}</div>
   <div class="row" style="justify-content:space-between"><button class="btn ghost danger" id="ce-del">✕ ${ar?'مسح الكل':'Remove all'}</button><span class="row"><button class="btn" data-act="close">${t('Cancel')}</button><button class="btn pri" id="ce-ok">${t('Save')}</button></span></div>`,true);
  const fin=msg=>{closeModal();save();const box=$('#res-ck'),y=window.scrollY;if(box)box.innerHTML=RES.ck();else render();window.scrollTo(0,y);toast(msg||t('Saved'))};
  $('#ce-del').onclick=()=>{if(S.att[v]){delete S.att[v];log('Undo',`${x.code} ${x.name} ${d}: record removed by the owner`)}fin()};
  $('#ce-ok').onclick=()=>{const i=$('#ce-in').value,o=$('#ce-out').value;if(o&&!i){toast(ar?'ما بيصير خروج بلا دخول.':'A check-out needs a check-in.');return}
    if(!i&&!o){if(S.att[v]){delete S.att[v];log('Undo',`${x.code} ${x.name} ${d}: record removed by the owner`)}fin();return}
    const old=S.att[v]||{};S.att[v]={...old,in:i,out:o,absent:false,by:old.by||actor(),at:old.at||new Date().toISOString(),setBy:actor()};delete S.att[v].ovr;delete S.att[v].ok;
    log('Attendance',`${x.code} ${x.name} ${d}: times set by the owner (in ${i||'-'}, out ${o||'-'}; was ${old.in||'-'} / ${old.out||'-'})`);fin()}}
function ckBulk(lm){if(!isOwner())return;const ar=ui.lang==='ar',keys=[...ui.ckSel].filter(k=>{const [d,id]=k.split('|'),x=byId(id);return x&&shiftOf(x,d)});if(!keys.length)return;
  const tw=ar?{in:'الدخول بس',out:'الخروج بس',both:'الدخول والخروج'}[ckTgt()]:{in:'check-in only',out:'check-out only',both:'check-in and check-out'}[ckTgt()];
  confirmBox(lm?(ar?`تسجيل ${keys.length} شخص متأخرين ${hm(lm)} ساعة (${tw})؟`:`Record ${keys.length} people late by ${hm(lm)} h (${tw})?`):(ar?`تسجيل ${keys.length} شخص على وقت الشيفت (${tw})؟`:`Record ${keys.length} people at shift times (${tw})?`),()=>{
    let skip=0;for(const v of keys)if(!ckRec(v,lm))skip++;
    if(skip)setTimeout(()=>toast(ar?`${skip} ما إلهن دخول، ما انسجّل خروجن.`:`${skip} had no check-in, so no check-out was set.`),900);
    log('Attendance',`${keys.length-skip} people set by the owner to ${lm?'late '+hm(lm)+' h':'on time'}, ${tgLabel()} (${[...new Set(keys.map(k=>k.split('|')[0]))].join(', ')}): ${keys.map(k=>byId(k.split('|')[1])?.code).join(', ')}`);
    ui.ckSel.clear();save();render();toast(t('Saved'))},ar?'موافق':'OK')}
function ckSetLate(v,lm){if(!isOwner())return;const [d,id]=v.split('|'),s=byId(id),sh=s&&shiftOf(s,d);if(!sh)return;lm=Math.max(0,Math.min(lm,720));
  if(!ckRec(v,lm)){toast(ui.lang==='ar'?'ما في دخول مسجّل لهالشخص، اختار "دخول" أو "التنين".':'No check-in yet for this person. Choose In or Both.');const box=$('#res-ck');if(box)box.innerHTML=RES.ck();return}
  clearTimeout(ovrLog[v]);ovrLog[v]=setTimeout(()=>{const x=S.att[v];if(!x)return;log('Attendance',`${s.code} ${s.name} ${d}: set by the owner to ${lm?'late '+hm(lm)+' h':'on time'}, ${tgLabel()} (in ${x.in||'-'}, out ${x.out||'-'})`);save()},1500);
  save();const box=$('#res-ck'),y=window.scrollY;if(box)box.innerHTML=RES.ck();window.scrollTo(0,y)}
function otOpen(ids){if(!isOwner())return;const ps=ids.map(byId).filter(Boolean);if(!ps.length){toast(ui.lang==='ar'?'حدد أشخاص أولاً.':'Select people first.');return}const ar=ui.lang==='ar',one=ps.length===1?ps[0]:null,day=doha().date<EVENT_START?EVENT_START:doha().date>EVENT_END?EVENT_END:doha().date;

   <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">${t('Cancel')}</button><button class="btn pri" id="ot-add">${ar?'إضافة':'Add'}</button></div>`,true);

    confirmBox(ar?`إضافة ${hm(mins)} ساعة لـ ${ps.length} شخص بيوم ${fmtD(d)}؟`:`Add ${hm(mins)} h to ${ps.length} people on ${fmtD(d)}?`,()=>{
      for(const x of ps){const c=byId(x.id);if(!c)continue;c.ot=[...(c.ot||[]),{id:uid(),d,mins,note,by:actor(),at:new Date().toISOString()}];log('Overtime',`${c.code} ${c.name} ${d}: +${hm(mins)} h${note?' · '+note:''}`)}
      save();render();toast(ar?'انضافت':'Added')},ar?'إضافة':'Add')}}
function ckTime(title,def,done){modal(`<h2>${esc(title)}</h2><label class="form" style="display:flex;flex-direction:column;gap:6px"><b class="small">${ui.lang==='ar'?'الوقت':'Time'}</b><input type="time" id="ck-t" value="${esc(def)}" style="font-size:22px;padding:10px"></label>

function ckDo(kind,v){if(!ckCan())return;const [d,id]=v.split('|'),s=byId(id),k=d+'|'+id,r=S.att[k],ar=ui.lang==='ar',today=d===doha().date,now=doha().time,sh=shiftOf(s,d);if(!s)return;
  const box=$('#res-ck'),y=window.scrollY;const done=msg=>{save();if(box)box.innerHTML=RES.ck();else render();window.scrollTo(0,y);if(msg)toast(msg)};
  const setIn=tm=>{S.att[k]={in:tm,out:'',absent:false,by:actor(),at:new Date().toISOString()};log('Check in',`${s.code} ${s.name} ${d} ${tm} (time keeper)`);done(`${s.name} · ${t('Check in')} ${tm}`)};
  const setOut=tm=>{const x=S.att[k];if(!x||!x.in)return;x.out=tm;log('Check out',`${s.code} ${s.name} ${d} ${tm} (time keeper)`);done(`${s.name} · ${t('Check out')} ${tm}`)};
  if(kind==='in'){if(today)setIn(now);else ckTime(`${t('Check in')} · ${s.name}`,sh?sh.start:'',setIn)}
  if(kind==='late')ckTime(`${t('Late')} · ${s.name}`,today?now:(sh?sh.start:''),setIn);
  if(kind==='out'){if(today)setOut(now);else ckTime(`${t('Check out')} · ${s.name}`,sh?sh.end:'',setOut)}
  if(kind==='undo'&&r)confirmBox(ar?`مسح تسجيل ${esc(s.name)} لهاليوم؟`:`Remove ${esc(s.name)}'s record for this day?`,()=>{delete S.att[k];log('Undo',`${s.code} ${s.name} ${d}: record removed (time keeper)`);done()});
  if(kind==='undo-out'&&r)confirmBox(ar?`مسح الخروج تبع ${esc(s.name)}؟`:`Remove ${esc(s.name)}'s check-out?`,()=>{r.out='';log('Undo',`${s.code} ${s.name} ${d}: check-out removed (time keeper)`);done()})}

function mark(id,kind){const s=byId(id),k=ui.day+'|'+id,tm=recTime();const r=S.att[k];

  if(kind==='ci'){S.att[k]={in:tm,out:'',absent:false,by:actor(),at:new Date().toISOString()};log('Check in',`${s.code} ${s.name} ${ui.day} ${tm}`)}
  if(kind==='co'&&r){if(tm<r.in&&!(shiftOf(s,ui.day)&&toMin(shiftOf(s,ui.day).end)<=toMin(shiftOf(s,ui.day).start))){toast('Check-out time is before check-in.');return}r.out=tm;log('Check out',`${s.code} ${s.name} ${ui.day} ${tm}`)}

  save();const keep=$('#rec-time')?.value;render();if(keep&&$('#rec-time'))$('#rec-time').value=keep;
}

async function setAccount(id){const s=byId(id),raw=($('#acc-'+id).value||'').trim().toLowerCase(),pw=$('#pw-'+id).value;

  const owner=Cloud.logins.get(raw);if(owner&&owner.staffId!==id||PM_EMAILS.includes(toEmail(raw))){toast('This username is already taken.');return}

  if(el.id==='set-rate-m'||el.id==='set-rate-s'){const k=el.id==='set-rate-m'?'rateM':'rateS',v=Math.max(0,parseFloat(el.value)||0);S.settings[k]=v;log('Settings',`Hourly rate ${k==='rateM'?'Marshal':'Supervisor'}: ${v} QAR`);save();toast(t('Saved'));return}
  if(el.id==='set-grace'){const g=Math.max(0,Math.min(120,parseInt(el.value,10)||0));S.settings.grace=g;log('Settings','Grace period: '+g+' min');save();toast(t('Saved'));return}
  if(el.dataset.shift){const x=shiftById(el.dataset.shift);if(x&&el.value){x[el.dataset.k]=el.value;log('Settings',`Shift ${x.id} ${el.dataset.k}: ${el.value}`);save();toast(t('Saved'))}return}
  if(el.dataset.rcp!=null&&can('settings')){const l=recips().map(x=>({...x}));l[+el.dataset.rcp][el.dataset.k]=el.value.trim();S.settings.recipients=l;log('Settings','Timesheet recipient updated');save();toast(t('Saved'));return}
  if(el.dataset.perm){permChange(el);return}
  if(el.id==='rv-from'){recvList();return}
  if(el.dataset.ckSel){el.checked?ui.ckSel.add(el.dataset.ckSel):ui.ckSel.delete(el.dataset.ckSel);const box=$('#res-ck'),y=window.scrollY;if(box)box.innerHTML=RES.ck();window.scrollTo(0,y);return}
  if(el.dataset.ckAll){const ks=el.dataset.ckAll.split(',');ks.forEach(k=>el.checked?ui.ckSel.add(k):ui.ckSel.delete(k));const box=$('#res-ck'),y=window.scrollY;if(box)box.innerHTML=RES.ck();window.scrollTo(0,y);return}
  if(el.dataset.ckOvr&&isOwner()){const v=el.dataset.ckOvr,[d,id]=v.split('|'),sh=shiftOf(byId(id),d),cur=ckLateOf(S.att[v],sh);
    if(el.value==='on')ckSetLate(v,0);else if(el.value==='late')ckSetLate(v,cur||15);else if(S.att[v]){const p=byId(id);delete S.att[v];log('Undo',`${p.code} ${p.name} ${d}: record removed by the owner`);save();const box=$('#res-ck');if(box)box.innerHTML=RES.ck()}return}
  if(el.id==='ck-day'){ui.f.ck.day=el.value;render();return}
  if(el.dataset.mv&&can('staff')){const s=byId(el.dataset.mv),to=el.value==='none'?'':el.value;if(!s||el.value==='')return;assign(s,'sup',to);save();toast(`${s.name} → ${to?supName(to):t('Unassigned')}`);render();groupList(ui.lastGrp||('sup|'+to));return}
  if(el.dataset.devMax){const em=el.dataset.devMax,n=+el.value,a=Cloud.access.get(em);if(!a||!can('accounts'))return;
    Cloud.db.collection('access').doc(em).update({maxDev:n}).then(()=>{log('Account',`${a.username||userLabel(em)}: devices allowed ${n||'unlimited'}`);save();toast(t('Saved'))}).catch(e=>toast('Not saved: '+e.code));return}
  if(el.dataset.accOn){const em=el.dataset.accOn,a=Cloud.access.get(em),on=el.checked;if(!a||!can('accounts'))return;
    Cloud.db.collection('access').doc(em).update({disabled:!on}).then(()=>{log('Account',`${a.name||a.username}: account ${on?'on':'off'}`);save();toast(on?(ui.lang==='ar'?'الحساب شغال':'Account on'):(ui.lang==='ar'?'الحساب موقوف، ما بيقدر يفوت':'Account off: they cannot sign in'))}).catch(e=>{toast('Not saved: '+(e.code||e.message));render()});return}
  if(el.dataset.accPos){const em=el.dataset.accPos,a=Cloud.access.get(em);if(a&&can('accounts'))Cloud.db.collection('access').doc(em).update({position:el.value.trim()}).then(()=>{log('Account',`${a.name||a.username}: position ${el.value.trim()}`);save();toast(t('Saved'))}).catch(e=>toast('Not saved: '+(e.code||e.message)));return}
  if(el.id==='lang-pick'){ui.lang=el.value;Prefs.set('lang',ui.lang);render();return}
  if(el.id==='ts-to'){tsToInfo();return}
  if(el.id==='sc-staff'){ui.scStaff=el.value;const s=byId(el.value);$('#sc-cur').value=s?shLabel(shiftOf(s,$('#sc-eff').value||ui.day)):'';return}
  if(el.dataset.f&&el.tagName==='SELECT'||el.dataset.f&&(el.type==='date'||el.type==='time'))filterInput(el);
});

function filterInput(el){const [scope,key]=el.dataset.f.split('.');ui.f[scope][key]=el.value;
  if(scope==='scope'){if(key==='from'&&ui.f.scope.to&&ui.f.scope.to<el.value)ui.f.scope.to='';render();return}const box=$('#res-'+scope);if(box)box.innerHTML=RES[scope]()}
/* ---------- Live sign-in ---------- */
function signInView(){return `<div class="auth">
  <div class="auth-side"><div class="tri" aria-hidden="true"></div><div class="meta">ITU 2026 · DECC Doha</div>

  <div class="auth-main">${ui.waitDev?`<div class="auth-form">${logoImg(44)}<h2>${ui.lang==='ar'?'بانتظار الموافقة':'Waiting for approval'}</h2>
   <div>${ui.lang==='ar'?'هذا الحساب مربوط بتلفون آخر. وصل طلب لمدير المشروع، وأول ما يوافق بتدخل تلقائياً. خلّي الصفحة مفتوحة.':'This account is linked to another phone. The Project Manager has been asked, and you will be let in as soon as they approve. Keep this page open.'}</div>
   <div class="row" style="gap:8px;align-items:center"><span class="dot-pulse"></span><span class="small muted">${ui.lang==='ar'?'عم نستنى...':'Waiting...'}</span></div>
   <button class="btn sm" type="button" data-act="wait-cancel">${ui.lang==='ar'?'إلغاء':'Cancel'}</button></div>`:`<form class="auth-form" id="auth-form" autocomplete="on">
   ${logoImg(44)}
   <h2>${ui.lang==='ar'?'تسجيل الدخول':'Sign in'}</h2>
   <label>${t('Username')}<input type="text" autocomplete="username" autocapitalize="none" spellcheck="false" id="au-email" value="${esc(ui.authEmail||'')}"></label>
   <label>${t('Password')}<span class="pw"><input type="password" autocomplete="current-password" id="au-pass"><button type="button" data-act="pw-eye" aria-label="Show password">${ICON.eye}</button></span></label>
   ${ui.authMsg?`<div class="small" style="color:var(--bad)">${esc(ui.authMsg)}</div>`:''}
   <button class="btn pri go" type="submit">${ui.lang==='ar'?'دخول':'Sign in'}</button>
   <div class="small muted">${ui.lang==='ar'?'نسيت كلمة السر؟ اطلب من مدير المشروع كلمة جديدة.':'Forgot your password? Ask the Project Manager for a new one.'}</div>
   <div class="row between"><button class="btn ghost sm" type="button" data-act="auth-up">Project Manager: first sign-in</button><button class="btn ghost sm" type="button" data-act="lang">${ui.lang==='ar'?'English':'العربية'}</button></div>
  </form>`}</div></div>`}
async function authAction(kind){const raw=($('#au-email').value||'').trim().toLowerCase(),pw=$('#au-pass').value;let em=toEmail(raw);ui.authEmail=raw;ui.authMsg='';
  try{if(!raw||!pw)throw{message:'Enter your username and password.'};
    if(kind==='auth-up'){if(!PM_EMAILS.includes(em))throw{message:'Only the Project Manager creates a password here. Supervisors get theirs from the Project Manager.'};if(pw.length<8)throw{message:'Use at least 8 characters for the password.'};await Cloud.auth.createUserWithEmailAndPassword(em,pw);return}
    if(!PM_EMAILS.includes(em)){const d=await Cloud.db.collection('logins').doc(raw).get();if(d.exists)em=d.data().email}
    Cloud.uname=raw;
    await Cloud.auth.signInWithEmailAndPassword(em,pw);
  }catch(e){const c=e.code||'';ui.authMsg=c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?(PM_EMAILS.includes(em)?'Username or password is wrong. First time here? Tap "Project Manager: first sign-in" to create your password.':'Username or password is wrong.'):c.includes('operation-not-allowed')?'Email/Password sign-in is not enabled in Firebase Authentication.':c.includes('email-already-in-use')?'This username already has a password. Sign in, or ask the Project Manager to reset it.':c.includes('invalid-email')?'Use letters, numbers, dots or dashes in the username.':c.includes('too-many-requests')?'Too many attempts. Wait a few minutes.':(e.message||'Sign-in failed.');render()}}
document.addEventListener('submit',e=>{if(e.target.id==='auth-form'){e.preventDefault();authAction('auth-in')}});
/* One phone per account: the first phone that signs in owns the account. Another phone is refused and the Project Manager is alerted. */
const DEV_ID=(()=>{let d=Prefs.get('dev','');if(!d){d=Array.from(crypto.getRandomValues(new Uint8Array(9)),x=>x.toString(16).padStart(2,'0')).join('');Prefs.set('dev',d)}return d})();
const devInfo=()=>({id:DEV_ID,standalone:isStandalone(),plat:IS_IOS?'iPhone':IS_ANDROID?'Android':'Computer',ua:navigator.userAgent.slice(0,200),ts:new Date().toISOString()});
async function deviceCheck(em){const ref=Cloud.db.collection('devices').doc(em),me=devInfo(),max=ui.maxDev??1;if(max===0)return true;let d;try{d=await ref.get()}catch(e){return true}
  if(!d.exists){try{await ref.set(me)}catch(e){}return true}
  const cur=d.data();if(cur.id===me.id||cur.prev===me.id||(cur.ids||[]).includes(me.id))return true;
  /* the owner allowed more than one device: the next ones join until the limit */
  if(max>1&&1+(cur.ids||[]).length<max){try{await ref.update({ids:[...(cur.ids||[]),me.id]});return true}catch(e){console.error(e)}}
  /* iPhone keeps the installed app apart from Safari: moving from the browser into the app on the same kind of phone is allowed once */
  if(!cur.standalone&&me.standalone&&cur.plat===me.plat&&!cur.prev){try{await ref.set({...me,prev:cur.id})}catch(e){}return true}
  try{const a=(await Cloud.db.collection('access').doc(em).get()).data()||{};await Cloud.db.collection('alerts').doc(Date.now().toString(36)+DEV_ID.slice(0,6)).set({email:em,username:a.username||Cloud.uname||'',name:a.name||'',staffId:a.staffId||'',plat:me.plat,ua:me.ua,ts:me.ts,first:cur.plat||'',seen:false,devId:me.id,standalone:me.standalone})}catch(e){console.error(e)}
  return false}
const notified=new Set();
function devNotify(list){list.filter(a=>!a.seen&&!notified.has(a.id)).forEach(a=>{notified.add(a.id);if(Date.now()-new Date(a.ts)>36e5)return;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(!('Notification' in window)||Notification.permission!=='granted')return;const ar=ui.lang==='ar',title=ar?'طلب دخول من تلفون جديد':'New phone sign-in request',body=`${a.name||a.username} · ${a.plat}`;
  (navigator.serviceWorker?navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',tag:a.id,requireInteraction:true})):Promise.reject()).catch(()=>{try{new Notification(title,{body,tag:a.id})}catch(e){}})})}
function alertPopup(){if(!can('accounts')||!$('#modal').hidden)return;const a=(Cloud.alerts||[]).find(x=>!x.seen);if(!a)return;const ar=ui.lang==='ar';
  modal(`<div class="small" style="text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--bad)">⚠ ${ar?'محاولة دخول من جهاز آخر':'Sign-in from another phone'}</div>
   <div style="font-size:16px"><b>${esc(a.name||a.username)}</b> <span class="mono small muted">${esc(a.username)}</span></div>
   <div>${ar?`حاول أحدهم الدخول بهذا الحساب من ${esc(a.plat)} آخر، وهو ينتظر موافقتك. إذا وافقت، يصير الحساب على التلفون الجديد ويطلع من الأول (${esc(a.first)}).`:`Someone is trying to sign in to this account on another ${esc(a.plat)} and is waiting for your approval. If you approve, the account moves to the new phone and the first one (${esc(a.first)}) is signed out.`}</div>
   <div class="small muted">${esc(tsFmt(a.ts))} (Doha)</div>
   <div class="row" style="justify-content:flex-end">${a.devId?`<button class="btn" data-act="alert-no" data-id="${esc(a.id)}">${ar?'رفض':'Refuse'}</button><button class="btn pri" data-act="alert-yes" data-id="${esc(a.id)}">${ar?'موافقة ودخول':'Approve'}</button>`:`<button class="btn" data-act="alert-reset" data-id="${esc(a.id)}">${ar?'السماح بالجهاز الجديد':'Allow the new phone'}</button><button class="btn pri" data-act="alert-ok" data-id="${esc(a.id)}">OK</button>`}</div>`)}
async function bootLive(){
  firebase.initializeApp(FIREBASE_CONFIG);Cloud.auth=firebase.auth();Cloud.db=firebase.firestore();
  const sid=new URLSearchParams(location.search).get('ts');if(sid){sharedView(sid);return}
  try{await Cloud.db.enablePersistence({synchronizeTabs:true})}catch(e){}
  Cloud.auth.onAuthStateChanged(async u=>{Cloud.unsubs.forEach(f=>f());Cloud.unsubs=[];Cloud.loaded.clear();Cloud.synced={};Cloud.priv=new Map();Cloud.access=new Map();Cloud.initDone=false;S={...freshState([],'live'),audit:[]};
    ui.authReady=true;if(!u){ui.role='';render();return}
    const em=(u.email||'').toLowerCase();Cloud.email=em;
    ui.owner=false;ui.perms={};ui.adminName='';ui.adminPos='';
    if(PM_EMAILS.includes(em)){ui.role='pm';ui.owner=true;ui.perms={all:true}}
    else{try{const d=await Cloud.db.collection('access').doc(em).get(),a=d.exists?d.data():null;
        if(a&&a.role==='supervisor')ui.role=a.staffId;else if(a&&a.role==='admin'&&!a.disabled){ui.role='pm';ui.perms=a.perms||{};ui.adminName=a.name||a.username||'';ui.adminPos=a.position||''}else ui.role='';
        if(a&&a.username)Cloud.uname=a.username;ui.maxDev=a&&a.maxDev!=null?+a.maxDev:1}catch(e){ui.role=''}
      if(!ui.role){ui.authMsg=ui.lang==='ar'?'هذا الحساب غير مفعّل. اطلب من مدير المشروع حساباً جديداً.':'This account is not active. Ask the Project Manager for a new one.';await Cloud.auth.signOut();return}}
    if(!ui.owner&&!(await deviceCheck(em))){ui.role='';ui.waitDev=true;render();
      const off=Cloud.db.collection('devices').doc(em).onSnapshot(d=>{const x=d.data()||{};
        if(x.id===DEV_ID||(x.ids||[]).includes(DEV_ID)){off();ui.waitDev=false;location.reload()}
        else if(x.denied===DEV_ID){off();ui.waitDev=false;ui.authMsg=ui.lang==='ar'?'رفض مدير المشروع الدخول من هذا التلفون.':'The Project Manager refused sign-in on this phone.';Cloud.auth.signOut()}},()=>{});
      Cloud.unsubs.push(off);return}
    ui.waitDev=false;
    if(!ui.owner)Cloud.unsubs.push(Cloud.db.collection('access').doc(em).onSnapshot(d=>{const x=d.data();if(x)ui.maxDev=x.maxDev!=null?+x.maxDev:1;if(x&&x.disabled){ui.authMsg=ui.lang==='ar'?'تم إيقاف هذا الحساب من مدير المشروع.':'This account was turned off by the Project Manager.';Cloud.auth.signOut()}},()=>{}));
    if(!ui.owner)Cloud.unsubs.push(Cloud.db.collection('devices').doc(em).onSnapshot(d=>{const x=d.data();if(ui.maxDev!==0&&x&&x.id&&x.id!==DEV_ID&&x.prev!==DEV_ID&&!(x.ids||[]).includes(DEV_ID)){ui.authMsg=ui.lang==='ar'?'تم نقل هذا الحساب لتلفون آخر بموافقة مدير المشروع.':'This account was moved to another phone by the Project Manager.';Cloud.auth.signOut()}},()=>{}));
    ui.authMsg='';render();Cloud.start()});
}

setInterval(()=>{if((!LIVE||ui.role)&&$('#modal').hidden&&!document.activeElement?.matches('input,select,textarea')&&['dash','team','rep'].includes(ui.tab))render()},60000);
{const h=location.hash.slice(1)||Prefs.get('tab','');if(h)ui.tab=h}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==ui.tab){ui.tab=h;render()}});

render();if(!LIVE)setTimeout(annPopup,300);
